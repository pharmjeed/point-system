# Optional: S3-compatible storage on this server (docs/DEPLOYMENT.md). Add after the production file:
#   docker compose --env-file .env -f infra/compose/docker-compose.prod.yml -f infra/compose/docker-compose.minio.yml up -d
# Caddy serves the buckets on the app origin (path-style), so the application uses
#   S3_ENDPOINT=https://<DOMAIN>  S3_FORCE_PATH_STYLE=true  STORAGE_ORIGIN= (empty)
# and S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY are the application's own MinIO user, created by minio-init.
# MinIO's console and admin API are not published.
# The image is built here from MinIO's Go sources (infra/docker/minio.Dockerfile, DEC-458): MinIO publishes no images
# any more. MINIO_IMAGE may name another MinIO-compatible image that also contains `mc`.
services:
  minio:
    image: ${MINIO_IMAGE:-point-minio:latest}
    build:
      context: ../docker
      dockerfile: minio.Dockerfile
      labels:
        sa.point.stack: point
    command: ['minio', 'server', '/data']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: 'off'
    volumes:
      - minio_data:/data
    networks:
      - point
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  # private buckets, the incoming/ lifecycle rule (DEC-97), no versioning (DEC-128), the application's user
  minio-init:
    image: ${MINIO_MC_IMAGE:-${MINIO_IMAGE:-point-minio:latest}}
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/minio-init.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-point-media}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-point-exports}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID (the application's MinIO user) is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - ./minio-init.sh:/init/minio-init.sh:ro
    networks:
      - point
    restart: 'no'

  api:
    depends_on:
      minio-init:
        condition: service_completed_successfully

  worker:
    depends_on:
      minio-init:
        condition: service_completed_successfully

  web:
    environment:
      STORAGE_UPSTREAM: minio:9000
      STORAGE_ORIGIN: ''

volumes:
  minio_data: {}
