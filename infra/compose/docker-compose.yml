# Local development services (05 §9.1): PostgreSQL 16, private MinIO buckets, WhatsApp simulator.
#   docker compose -f infra/compose/docker-compose.yml up -d
name: point
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: point
      POSTGRES_PASSWORD: point
      POSTGRES_DB: point
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U point -d point']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Buckets are private: an anonymous GET on any object returns 403 (PNT-002 AC2).
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minio minio-secret &&
                  mc mb -p local/point-media local/point-exports &&
                  mc anonymous set none local/point-media &&
                  mc anonymous set none local/point-exports"

  wa-simulator:
    build: ../../tools/wa-simulator
    environment:
      PORT: '4010'
      WEBHOOK_URL: http://host.docker.internal:3000/webhooks/whatsapp
      APP_SECRET: ${WA_APP_SECRET:-local-app-secret}
      VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-local-verify-token}
      ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-local-access-token}
      PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-100000000000001}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['4010:4010']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4010/_sim/health']
      interval: 5s
      retries: 10

volumes:
  pgdata: {}
  miniodata: {}
