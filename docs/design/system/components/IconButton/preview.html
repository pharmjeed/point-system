<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>IconButton</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(R, null,
  h(S, {label:'عادي'}, h(P.IconButton, {icon:'search', label:'بحث'}), h(P.IconButton, {icon:'x', label:'إغلاق', variant:'secondary'})),
  h(S, {label:'ضغط'}, h(P.IconButton, {icon:'search', label:'بحث', pressed:true})),
  h(S, {label:'تعطيل'}, h(P.IconButton, {icon:'camera', label:'تصوير', disabled:true})),
  h(S, {label:'«جارٍ…»'}, h(P.IconButton, {icon:'refresh-cw', label:'تحديث', loading:true})),
  h(S, {label:'مع عدّاد'}, h(P.IconButton, {icon:'bell-ring', label:'التنبيهات، 3 جديدة', badge:'3'})))));
</script>
</body>
</html>
