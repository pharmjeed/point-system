<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>ConnectionIndicator</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(R, null,
  h(S, {label:'online'}, h(P.ConnectionIndicator, {state:'online'})),
  h(S, {label:'uncertain'}, h(P.ConnectionIndicator, {state:'uncertain', lastSync:'40s'})),
  h(S, {label:'offline (خطأ)'}, h(P.ConnectionIndicator, {state:'offline', lastSync:'22:58'})))));
</script>
</body>
</html>
