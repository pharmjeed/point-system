<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Radio</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(React.Fragment, null,
  h(P.Radio, {name:'r1', legend:'سبب الإلغاء', value:'dup', options:[['dup','تذكرة مكررة'],['wrong','بيانات خاطئة'],['other','سبب آخر']]}),
  h(P.Radio, {name:'r2', legend:'سبب الإلغاء', error:'اختر سببًا', options:[['dup','تذكرة مكررة'],['wrong','بيانات خاطئة']]}),
  h(P.Radio, {name:'r3', legend:'تعطيل', value:'dup', disabled:true, options:[['dup','تذكرة مكررة']]}))));
</script>
</body>
</html>
