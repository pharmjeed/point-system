<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>TextField</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(React.Fragment, null,
  h(P.TextField, {id:'t1', label:'نوع المركبة', placeholder:'مثال: تويوتا كامري', hint:'الماركة والطراز'}),
  h(P.TextField, {id:'t2', label:'نوع المركبة', value:'تويوتا كامري', pressed:true}),
  h(P.TextField, {id:'t3', label:'رقم التذكرة', value:'99999', dir:'ltr', inputMode:'numeric', error:'لا توجد تذكرة بهذا الرقم'}),
  h(P.TextField, {id:'t4', label:'رمز الربط', value:'K7Q2-9F', loading:true, dir:'ltr'}),
  h(P.TextField, {id:'t5', label:'الموقع', value:'قاعة ريماس', disabled:true}))));
</script>
</body>
</html>
