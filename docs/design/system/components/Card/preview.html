<!-- @dsCard group="البطاقات والقوائم" height=300 -->
<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Card</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(R, null,
  h(S, {label:'عادي'}, h(P.Card, null, h('strong', null, 'قاعة ريماس'), h('span', {style:{color:'var(--pt-text-muted)', fontSize:14}}, 'حفل آل فلان · 214 مركبة'))),
  h(S, {label:'مرتفع'}, h(P.Card, {elevated:true}, h('strong', null, 'طلب جديد'), h('span', {style:{color:'var(--pt-text-muted)', fontSize:14}}, 'shadow-md'))),
  h(S, {label:'خطأ'}, h(P.Card, {tone:'danger'}, h('strong', null, 'تعذّر التحميل'), h('span', {style:{color:'var(--pt-danger-text)', fontSize:14}}, 'اسحب للتحديث'))))));
</script>
</body>
</html>
