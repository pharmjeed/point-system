<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>SpotGrid</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(React.Fragment, null,
  h(P.SpotGrid, {label:'اختر الموقف', selected:'B-03', pressed:'B-05', allowNote:true, spots:['B-01','B-02','B-03','B-04','B-05','B-06','B-07','B-08'].map(function(c,i){ return {code:c, occupied: i===0 || i===5}; })}),
  h(P.SpotGrid, {search:false, error:'اختر موقفًا', spots:['K-01','K-02','K-03','K-04'].map(function(c,i){ return {code:c, occupied:i===2}; })}))));
</script>
</body>
</html>
