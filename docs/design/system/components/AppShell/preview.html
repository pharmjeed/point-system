<!-- @dsCard group="الهيكل والتنقل" height=760 -->
<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>AppShell</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, function(t){ return h('div', {style:{height:640, border:'1px solid var(--pt-border)', borderRadius:16, overflow:'hidden'}},
  h(P.AppShell, {
    topBar: h(P.TopBar, {title:'بوينت', driverState:'available', connection: t==='dark' ? 'uncertain' : 'online', lastSync:'40s'}),
    banner: t==='dark' ? h(P.Banner, {kind:'stale'}) : null,
    bottomNav: h(P.BottomNav, {active:'home'}),
    offer: h(P.OfferCard, {mode:'single', ticketNumber:125, vehicleSummary:'تويوتا كامري · أبيض', plate:{digits:'1234', letters:['ب','ح','د']}, waiting:'1:12', venue:'حفل آل فلان', secondsLeft:21})},
    h('p', {className:'pt-meta', style:{margin:0, color:'var(--pt-text-muted)'}}, 'قاعة ريماس · حفل آل فلان'),
    h(P.Button, {size:'lg', iconStart:'plus'}, 'استلام مركبة'),
    h(P.Skeleton, {withAction:true})));
}));
</script>
</body>
</html>
