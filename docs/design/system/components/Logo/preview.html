<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Logo</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, function(t){ return h(React.Fragment, null,
  h(S, {label:'mark — TopBar ‏28px + «بوينت» نصًا'}, h('span', {style:{display:'inline-flex', alignItems:'center', gap:8}}, h(P.Logo, {variant:'mark', height:28, alt:''}), h('strong', {style:{fontSize:18}}, 'بوينت'))),
  h(S, {label:'lockup-rtl — SideNav ≥1024px', wide:true}, h(P.Logo, {variant:'lockup-rtl', theme:t, height:44})),
  h(S, {label:'stacked — شاشة الدخول (≥120px)', wide:true}, h(P.Logo, {variant:'stacked', theme:t, height:150})),
  h(S, {label:'masaf wordmark — أسطح العميل فقط', wide:true}, h(P.Logo, {brand:'masaf', variant:'wordmark', theme:t, height:44})));
}));
</script>
</body>
</html>
