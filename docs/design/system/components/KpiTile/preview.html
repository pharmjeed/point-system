<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>KpiTile</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(R, null,
  h(S, {label:'عادي'}, h(P.KpiTile, {label:'الطلبات المفتوحة', value:'7', icon:'bell-ring'})),
  h(S, {label:'تنبيه'}, h(P.KpiTile, {label:'أقدم انتظار', value:'6:40', icon:'clock', tone:'warning'})),
  h(S, {label:'خطأ'}, h(P.KpiTile, {label:'الرسائل الفاشلة', value:'1', icon:'message-circle', tone:'danger'})),
  h(S, {label:'«جارٍ…»'}, h(P.KpiTile, {label:'أقدم انتظار', loading:true})))));
</script>
</body>
</html>
