<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Toast</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h('div', {style:{display:'grid', gap:8, justifyItems:'center'}},
  h(P.Toast, {tone:'success', message:'تم القبول'}),
  h(P.Toast, {tone:'error', message:'قبل الطلب سائق آخر'}),
  h(P.Toast, {tone:'info', message:'انتهى العرض'}))));
</script>
</body>
</html>
