<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Banner</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, {stack:true}, h('div', {style:{display:'grid', gap:8}},
  h(P.Banner, {kind:'offline'}),
  h(P.Banner, {kind:'stale', pressed:true}),
  h(P.Banner, {kind:'audio', loading:true}),
  h(P.Banner, {kind:'whatsapp'}),
  h(P.Banner, {kind:'notifications'}),
  h(P.Banner, {kind:'update'}))));
</script>
</body>
</html>
