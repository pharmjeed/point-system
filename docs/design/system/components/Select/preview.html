<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Select</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(React.Fragment, null,
  h(P.Select, {id:'s1', label:'الحفل', placeholder:'اختر الحفل', options:[['a','حفل آل فلان — قاعة ريماس'],['b','حفل آل فلان — قاعة الماسة']]}),
  h(P.Select, {id:'s2', label:'الحفل', value:'a', pressed:true, options:[['a','حفل آل فلان — قاعة ريماس']]}),
  h(P.Select, {id:'s3', label:'الحفل', placeholder:'اختر الحفل', error:'اختر الحفل أولًا', options:[]}),
  h(P.Select, {id:'s4', label:'الحفل', value:'a', disabled:true, options:[['a','حفل آل فلان — قاعة ريماس']]}))));
</script>
</body>
</html>
