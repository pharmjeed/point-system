<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>CountdownRing</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h(R, null,
  h(S, {label:'30 ث'}, h(P.CountdownRing, {seconds:30})),
  h(S, {label:'21 ث'}, h(P.CountdownRing, {seconds:21})),
  h(S, {label:'تحت 10 ث: warning'}, h(P.CountdownRing, {seconds:7})),
  h(S, {label:'انتهى'}, h(P.CountdownRing, {seconds:0})))));
</script>
</body>
</html>
