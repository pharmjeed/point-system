<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>PhotoTile</title>
<style>html,body{margin:0} body{padding:12px;background:var(--pt-bg);color:var(--pt-text);font-family:var(--pt-font-sans);}</style>
</head>
<body>
<div id="root" dir="rtl" lang="ar"></div>
<script>
var P = window.Point, h = React.createElement, M = P._Modes, S = P._State, R = P._Row;
ReactDOM.createRoot(document.getElementById('root')).render(h(M, null, h('div', {className:'pt-photogrid'},
  h(P.PhotoTile, {angle:'أمام'}),
  h(P.PhotoTile, {angle:'خلف', pressed:true}),
  h(P.PhotoTile, {angle:'يمين', state:'uploading', progress:64}),
  h(P.PhotoTile, {angle:'يسار', state:'uploaded'}),
  h(P.PhotoTile, {angle:'أمام', state:'failed'}),
  h(P.PhotoTile, {angle:'خلف', disabled:true}))));
</script>
</body>
</html>
