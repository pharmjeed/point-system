      operationId: customerPass
      summary: سر بطاقة الدخول للجهاز (C-11)
      tags: [Customer]
      description: |-
        ما يحتاجه التطبيق ليولّد QR بطاقة الدخول بلا اتصال (V2-D14، DEC-500): السر (32 بايت base64url) يُحفظ في التخزين الآمن للجهاز ولا يُسجَّل ولا يُعرض، ووقت الخادم لتصحيح ساعة الجهاز، والسيارات للاختيار. الرمز يتغير كل 30 ث بصيغة P1.<account>.<vehicle>.<step>.<mac> (docs/v2/05 §1.3). يُنشأ السر أول مرة، ويُدوَّر عند الطلب بعد مضي مدته (refresh_after) ويبقى السابق صالحًا 7 أيام لجهاز بلا اتصال. الرد Cache-Control: no-store.
