        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 05XXXXXXXX أو +9665XXXXXXXX
                  examples: ['0551234567']
                secret:
                  type: string
                  minLength: 6
                  maxLength: 128
              required: [phone, secret]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
