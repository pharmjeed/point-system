                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
              required: [verification]
              additionalProperties: false
            examples:
              code_cash:
                summary: رمز + تحصيل نقدي
                value:
                  verification:
                    method: code
                    code: '482731'
                  payment:
                    method: cash
                    amount_halalas: 2000
              code_included:
                summary: رمز (خدمة مشمولة)
                value:
                  verification:
                    method: code
                    code: '482731'
