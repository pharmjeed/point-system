      summary: إنهاء التسجيل والانتقال للصف
      tags: [Intake & Tickets]
      description: |-
        يتحقق من الحقول الإلزامية. واتساب: (جوال + موافقة) للربط المباشر، أو رمز QR صادر لهذه التذكرة (active أو pending_confirmation) أو مؤكد — في وضع QR تستدعي الواجهة POST /whatsapp-link {method: qr} قبل الإرسال مباشرة ثم تعرض اللوحة في D-07. عميل أوقف الرسائل مع الربط المباشر ← WA_CUSTOMER_OPTED_OUT. ورقي: paper_serial. الصور الناقصة تعيد INSPECTION_INCOMPLETE ما لم يُرسل acknowledge_incomplete_inspection=true فتستمر التذكرة بحالة فحص incomplete ويُرفع تنبيه للمشرف.

        الشروط: status=received · منشئ التذكرة

        الأثر: status=parking (لقطة الرسوم أُخذت عند الإنشاء، DEC-43)؛ واتساب مباشر: wa_link_status=pending_send + action token + job.wa_send(W-01)؛ alert inspection_incomplete عند الحاجة
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
                acknowledge_incomplete_inspection:
                  type: boolean
                  default: false
              required: [expected_version]
              additionalProperties: false
            examples:
              submit:
                summary: إنهاء التسجيل
                value:
                  expected_version: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS | INSPECTION_INCOMPLETE | INVALID_STATE_TRANSITION | VERSION_CONFLICT | WA_CUSTOMER_OPTED_OUT | WA_TEMPLATE_NOT_APPROVED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: CONSENT_REQUIRED | IDEMPOTENCY_KEY_REUSED | INTAKE_INCOMPLETE | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.intake
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [CONSENT_REQUIRED, INSPECTION_INCOMPLETE, INTAKE_INCOMPLETE, INVALID_STATE_TRANSITION, TICKET_NOT_FOUND, VERSION_CONFLICT, WA_CUSTOMER_OPTED_OUT,
        WA_TEMPLATE_NOT_APPROVED]
      x-domain-events: [ticket.intake_submitted, ticket.wa_link_changed, alert.raised]
      x-ws-events: [ticket.updated]
      x-whatsapp: [W-01]
