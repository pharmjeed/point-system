  /v1/platform/payments/{paymentId}/refunds:
    post:
      operationId: platformIssueRefund
      summary: استرداد دفعة إلكترونية
      tags: [Platform]
      description: |-
        P-06 / P-08 (V2-021، DEC-513): استرداد جزئي أو كامل لدفعة إلكترونية بسبب مسجّل، بصلاحية platform.refund_issue (المالية والمالك). المبلغ بالهللة، وغيابه = كل المتبقي. البوابة تُستدعى بعد COMMIT في العامل (job.payment_refund_send)، استرداد بعد آخر للدفعة نفسها، فالرد 201 بحالة requested، والنتيجة succeeded أو failed تُكتب لاحقًا مع تحديث refunded_halalas وحالة الدفعة (partially_refunded / refunded).

        الشروط: سبب 3 محارف على الأقل بعد التشذيب ← وإلا REASON_REQUIRED؛ دفعة غير موجودة ← RESOURCE_NOT_FOUND؛ حالة الدفعة paid أو partially_refunded ← وإلا PAYMENT_NOT_REFUNDABLE؛ المبلغ ≤ المدفوع − المسترد − ما ينتظر الإرسال ← وإلا REFUND_AMOUNT_EXCEEDS_PAID (refundable_halalas)

        الأثر: refunds(requested) + outbox job.payment_refund_send (ordering_key refund:<paymentId>)؛ platform_audit_log (refund.issue، والمشغل في audit_log لزيارة) وcustomer_audit_log في المعاملة نفسها
      parameters:
      - $ref: '#/components/parameters/paymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_halalas:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: غيابه = استرداد كل المتبقي
                reason:
                  type: [string, 'null']
                  maxLength: 500
                  description: 3 محارف على الأقل بعد التشذيب، وإلا REASON_REQUIRED؛ بلا رقم بطاقة
              required: [reason]
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformRefundEnvelope'
        '401':
