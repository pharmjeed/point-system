# =====================================================================
# docs/07_openapi.yaml — POINT Valet API v1 (OpenAPI 3.1)
# Staff app brand: بوينت · POINT        Customer WhatsApp brand: مصاف · MASAF
# Machine-readable source of truth for the HTTP contract. Explained with
# examples in 07_API_Contract.md. Binding names: 00_Glossary_Canon.md.
# Field names follow 06_schema.sql. Keep all three in sync when editing.
#
# Operation extensions:
#   x-permission        canon §10 permission checked server-side (scope rules in description)
#   x-idempotency       required | optional | none  (Idempotency-Key header)
#   x-error-codes       canon §8 codes the operation may return (incl. generic ones)
#   x-domain-events     canon §7.1 events written to outbox in the SAME transaction
#   x-ws-events         canon §7.3 server→client events published after commit
#   x-whatsapp          canon §11 customer messages (مصاف) queued by the operation
#   x-rate-limit-class  auth | command | write | read | device | export | webhook | health
# =====================================================================
openapi: 3.1.0
info:
  title: 'POINT Valet API (staff: بوينت · customer channel: مصاف)'
  version: 1.0.0
  summary: 'واجهة HTTP لنظام الفاليت: موقع الموظفين (بوينت) وتكامل واتساب العميل (مصاف)'
  description: |-
    مرجع آلي لعقد الـAPI. الشرح والأمثلة في docs/07_API_Contract.md، الأسماء الملزمة في docs/00_Glossary_Canon.md.

    - الجلسة: كوكي httpOnly آمن __Host-point_sid. الأوامر غير الآمنة تتطلب ترويسة X-Requested-With: point-web.
    - Idempotency-Key إلزامي حيث x-idempotency=required؛ الإعادة بنفس المفتاح والمحتوى تعيد الرد المحفوظ (meta.replayed=true).
    - expected_version: تعارضه يعيد 409 VERSION_CONFLICT.
    - كل رد يحمل X-Request-Id. الأخطاء بغلاف ErrorResponse ورموز canon §8.
    - الأوقات ISO-8601 UTC؛ المبالغ بالهللة؛ الأرقام لاتينية.
    - WebSocket (Socket.IO) على المسار /ws: انظر 07_API_Contract.md §4.
    - الامتدادات: x-permission, x-idempotency, x-error-codes, x-domain-events, x-ws-events, x-whatsapp, x-rate-limit-class.
servers:
- url: https://app.example.sa
  description: الإنتاج — التطبيق والـAPI من أصل واحد (DEC-29)؛ النطاق يحدده المالك (Q-01)
- url: https://staging.example.sa
  description: الاختبار — أصل واحد؛ واتساب بوضع simulator أو رقم اختبار
- url: http://localhost:3000
  description: محلي (docker-compose)
tags:
- name: Auth
- name: Me & Duty
- name: Intake & Tickets
- name: Retrieval & Handover
- name: Payments
- name: Venues & Setup
- name: Events & Shifts
- name: Drivers & Staff
- name: Alerts & Incidents
- name: Reports & Exports
- name: Admin
- name: Platform
  description: الإصدار الثاني — لوحة المنصة /platform (docs/v2/02)، جلسة منفصلة __Host-point_psid
- name: Customer
  description: 'الإصدار الثاني — تطبيق العميل /v1/customer/* (docs/v2/05 §1، V2-010)؛ Bearer قصير + رمز تحديث يُدوَّر، بلا كوكي ولا CSRF'
- name: Webhooks
- name: Health
security:
- cookieSession: []
paths:
  /v1/auth/login:
    post:
      operationId: authLogin
      summary: تسجيل الدخول
      tags: [Auth]
      description: |-
        السائق: الجوال + رقم سري 6 أرقام. المشرف/الإدارة/المالك: الجوال + كلمة مرور ثم TOTP. يضبط الكوكي __Host-point_sid عند نجاح الدخول دون MFA معلّق.

        الشروط: 5 محاولات فاشلة ثم قفل 15 دقيقة (security.max_login_attempts)

        الأثر: ينشئ auth_sessions ويضبط Set-Cookie: __Host-point_sid (إلا إذا mfa_required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 05XXXXXXXX أو +9665XXXXXXXX
                  examples: ['0551234567']
                secret:
                  type: string
                  description: PIN أو كلمة مرور
                  minLength: 6
                  maxLength: 128
                device_label:
                  type: string
                  maxLength: 60
              required: [phone, secret]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResultEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_INVALID_CREDENTIALS
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_ACCOUNT_DISABLED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '423':
          $ref: '#/components/responses/Error'
          description: AUTH_ACCOUNT_LOCKED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - csrfHeader: []
      x-permission: public
      x-idempotency: none
      x-rate-limit-class: auth
      x-error-codes: [AUTH_ACCOUNT_DISABLED, AUTH_ACCOUNT_LOCKED, AUTH_INVALID_CREDENTIALS]
  /v1/auth/mfa/verify:
    post:
      operationId: authMfaVerify
      summary: التحقق الثنائي بعد كلمة المرور
      tags: [Auth]
      description: |-
        mfa_token غير معروف أو منتهٍ (5 دقائق) أو مستخدم ← 401 AUTH_MFA_REQUIRED: أعد إدخال كلمة المرور.

        الأثر: ينشئ الجلسة mfa_verified=true ويضبط الكوكي
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  pattern: ^[0-9]{6}$
              required: [mfa_token, code]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_INVALID | AUTH_MFA_REQUIRED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '423':
          $ref: '#/components/responses/Error'
          description: AUTH_ACCOUNT_LOCKED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - csrfHeader: []
      x-permission: public
      x-idempotency: none
      x-rate-limit-class: auth
      x-error-codes: [AUTH_ACCOUNT_LOCKED, AUTH_MFA_INVALID, AUTH_MFA_REQUIRED]
  /v1/auth/mfa/setup:
    post:
      operationId: authMfaSetup
      summary: بدء إعداد TOTP
      tags: [Auth]
      description: 'الأثر: يحفظ سرًا مؤقتًا مشفرًا حتى التأكيد'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      otpauth_uri:
                        type: string
                      secret_base32:
                        type: string
                        description: يُعرض مرة واحدة للإدخال اليدوي
                    required: [otpauth_uri, secret_base32]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '409':
          $ref: '#/components/responses/Error'
          description: INVALID_STATE_TRANSITION
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: none
      x-rate-limit-class: write
      x-error-codes: [INVALID_STATE_TRANSITION]
  /v1/auth/mfa/confirm:
    post:
      operationId: authMfaConfirm
      summary: تأكيد TOTP وتفعيله
      tags: [Auth]
      description: 'الأثر: users.mfa_enabled=true؛ الجلسة الحالية mfa_verified=true'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
              required: [code]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_INVALID | AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '409':
          $ref: '#/components/responses/Error'
          description: INVALID_STATE_TRANSITION
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: none
      x-rate-limit-class: write
      x-error-codes: [AUTH_MFA_INVALID, INVALID_STATE_TRANSITION]
  /v1/auth/secret/change:
    post:
      operationId: authSecretChange
      summary: تغيير الرقم السري/كلمة المرور
      tags: [Auth]
      description: |-
        الشروط: PIN للسائق 6 أرقام بالضبط (DEC-09) · كلمة المرور للموظفين 12 حرفًا على الأقل وليست من قائمة الكلمات الشائعة (الملف 09 §9)

        الأثر: must_change_secret=false؛ تُبطل جلسات المستخدم الأخرى (secret_reset)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_secret:
                  type: string
                new_secret:
                  type: string
                  minLength: 6
                  maxLength: 128
              required: [current_secret, new_secret]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_INVALID_CREDENTIALS | AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: none
      x-rate-limit-class: write
      x-error-codes: [AUTH_INVALID_CREDENTIALS]
  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: تسجيل الخروج
      tags: [Auth]
      description: 'الأثر: revoked_reason=logout؛ يمسح الكوكي'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: none
      x-rate-limit-class: write
      x-error-codes: []
  /v1/me:
    get:
      operationId: getMe
      summary: بيانات المستخدم الحالي وصلاحياته
      tags: [Me & Duty]
      description: بيانات المستخدم الحالي وصلاحياته
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      x-permission: auth.self
      x-idempotency: none
      x-rate-limit-class: read
      x-error-codes: []
  /v1/me/home:
    get:
      operationId: getMyHome
      summary: الشاشة الرئيسية للسائق ومصدر المزامنة الكاملة
      tags: [Me & Duty]
      description: |-
        تعيد المهمة الحالية والتالية وبطاقة العرض الوحيدة (أقدم طلب قابل للقبول) وحالة السائق. تُستدعى عند الفتح وبعد إعادة الاتصال وعند sync.required.

        الشروط: دور driver أو supervisor مع can_drive
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverHomeEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: ASSIGNMENT_REQUIRED | AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      x-permission: duty.self
      x-idempotency: none
      x-rate-limit-class: read
      x-error-codes: [ASSIGNMENT_REQUIRED]
  /v1/me/devices:
    post:
      operationId: registerDevice
      summary: تسجيل جهاز المستخدم
      tags: [Me & Duty]
      description: تسجيل جهاز المستخدم
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 60
                platform:
                  $ref: '#/components/schemas/DevicePlatform'
                display_mode:
                  $ref: '#/components/schemas/DisplayMode'
                notification_permission:
                  $ref: '#/components/schemas/NotificationPermission'
              required: [platform, display_mode, notification_permission]
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: optional
      x-rate-limit-class: device
      x-error-codes: []
  /v1/me/devices/{deviceId}:
    put:
      operationId: updateDevice
      summary: تحديث الجهاز واشتراك Web Push
      tags: [Me & Duty]
      description: 'الشروط: الجهاز يخص المستخدم'
      parameters:
      - $ref: '#/components/parameters/deviceId'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: [string, 'null']
                  maxLength: 60
                display_mode:
                  $ref: '#/components/schemas/DisplayMode'
                notification_permission:
                  $ref: '#/components/schemas/NotificationPermission'
                push_subscription:
                  type: [object, 'null']
                  properties:
                    endpoint:
                      type: string
                      format: uri
                    keys:
                      type: object
                      properties:
                        p256dh:
                          type: string
                        auth:
                          type: string
                      required: [p256dh, auth]
                  required: [endpoint, keys]
                  description: من PushManager.subscribe؛ null لإلغاء الاشتراك
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: optional
      x-rate-limit-class: device
      x-error-codes: []
  /v1/me/audio-test:
    post:
      operationId: recordAudioTest
      summary: تسجيل نتيجة «تفعيل واختبار الصوت»
      tags: [Me & Duty]
      description: تسجيل نتيجة «تفعيل واختبار الصوت»
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  format: uuid
                result:
                  $ref: '#/components/schemas/AudioTestResult'
              required: [device_id, result]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: auth.self
      x-idempotency: optional
      x-rate-limit-class: device
      x-error-codes: []
  /v1/me/duty/start:
    post:
      operationId: startDuty
      summary: بدء ورديتي
      tags: [Me & Duty]
      description: |-
        المشغل معلّق أو منتهٍ من المنصة ← 409 OPERATOR_SUSPENDED (V2-005، DEC-486)

        الشروط: تعيين نشط (السائق) أو نطاق الموقع (مشرف can_drive) · وردية open لمجموعة التوزيع · لا مناوبة مفتوحة

        الأثر: duty_sessions(on_duty, available_since=now) + الانضمام لغرفة pool:{poolId}:drivers + تمريرة توزيع
      parameters:
