                        contacts:
                          type: array
                          items:
                            type: object
                            properties:
                              wa_id:
                                type: string
                              profile:
                                type: object
                                properties:
                                  name:
                                    type: string
                        messages:
                          type: array
                          items:
                            type: object
                            properties:
                              from:
                                type: string
                              id:
                                type: string
                                description: wamid
                              timestamp:
                                type: string
                              type:
                                type: string
                                examples: [button, text, interactive]
                              button:
                                type: object
                                properties:
                                  payload:
                                    type: string
                                    description: رمز الإجراء (action token)
                                  text:
                                    type: string
                                    examples: [طلب السيارة]
                              text:
                                type: object
                                properties:
                                  body:
                                    type: string
                              context:
                                type: object
                                properties:
                                  from:
                                    type: string
                                  id:
                                    type: string
                                    description: wamid رسالة القالب الأصلية
                            additionalProperties: true
                        statuses:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: wamid
                              status:
                                type: string
                                examples: [sent, delivered, read, failed]
                              timestamp:
                                type: string
                              recipient_id:
                                type: string
                              errors:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    code:
                                      type: integer
                                    title:
                                      type: string
                                    message:
                                      type: string
                                  additionalProperties: true
                            additionalProperties: true
                      additionalProperties: true
      required: [object, entry]
