        employee_code:
          type: string
          examples: [D-0042]
        full_name:
          type: string
          examples: [سعد الحربي]
        phone_e164:
          type: [string, 'null']
          description: يظهر لصاحب الحساب وللإدارة؛ مقنّع لغيرهم
          examples: ['+966551234567']
        phone_masked:
          type: string
          examples: [05•••••567]
        role:
          $ref: '#/components/schemas/Role'
        can_drive:
          type: boolean
        status:
          $ref: '#/components/schemas/UserStatus'
        mfa_enabled:
          type: boolean
        must_change_secret:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time
        disabled_at:
          type: [string, 'null']
          format: date-time
        disabled_reason:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
          description: رقم الإصدار للتزامن المتفائل
        created_at:
          type: string
          format: date-time
      required: [id, employee_code, full_name, role, status, version]
    DriverAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        driver_id:
          type: string
