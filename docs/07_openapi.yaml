              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
                custody_returned_to_customer:
                  type: boolean
                  description: يجب أن يكون true (إقرار عودة المركبة والمفتاح للعميل)، وإلا CUSTODY_OPEN بالعناصر التي لم تعد للعميل (DEC-175)
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
              required: [reason, custody_returned_to_customer]
              additionalProperties: false
      responses:
