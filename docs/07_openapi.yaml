    post:
      operationId: customerPaymentMethodCreate
      summary: حفظ بطاقة C-18
      tags: [Customer]
      description: |-
        C-18 (V2-023، DEC-524): حفظ بطاقة رُمّزت على الجهاز (Moyasar save_only) بموافقة card_on_file صريحة بالإصدار الساري (CUSTOMER_CONSENT_REQUIRED / CUSTOMER_CONSENT_VERSION_STALE). العلامة وآخر 4 أرقام والانتهاء يقرؤها الخادم من البوابة (GET /v1/tokens/{id}) لا من التطبيق؛ رمز لا تعرفه البوابة أو غير نشط VALIDATION_FAILED. الأولى تصير الافتراضية.

        الأثر: customer_account_consents (card_on_file) + customer_payment_methods + customer_audit_log (customer.payment_method.saved)
      requestBody:
