      tags: [Venues & Setup]
      description: |-
        استبدال كامل (DEC-490): expected_version = 0 لإنشاء الملف، وإلا رقم إصدار الملف. أي تغيير يعيد الملف draft: يسحب طلب المراجعة، والملف المعتمد يغيب عن الخريطة حتى يُعتمد ثانية (DEC-492)؛ والجسم المطابق لا يغير شيئًا. العنوان والمدينة يُكتبان في venues.address وvenues.city (DEC-491). الملف المخفي من المنصة ← INVALID_STATE_TRANSITION (reason: hidden_by_platform).

