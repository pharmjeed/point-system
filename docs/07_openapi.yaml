      name: zoneId
      in: path
      required: true
      description: معرّف منطقة الوقوف
      schema:
        type: string
        format: uuid
  headers:
    RetryAfter:
      description: ثوانٍ قبل إعادة المحاولة
      schema:
        type: integer
        minimum: 1
  responses:
    Error:
      description: خطأ بغلاف ErrorResponse؛ الرموز المحتملة في وصف كل استجابة وفي x-error-codes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CustomerError:
      description: خطأ بغلاف 08 لمسارات العميل؛ code من CUSTOMER_ERROR_CATALOG أو رموز 08 المعادة (docs/v2/05 §5)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerErrorResponse'
    CustomerRateLimited:
      description: RATE_LIMITED (details.retry_after_s، وscope phone | device | resend على طلب الرمز)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CustomerErrorResponse'
    RateLimited:
      description: RATE_LIMITED أو RESEND_LIMIT_REACHED
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
