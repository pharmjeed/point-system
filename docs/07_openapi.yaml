      description: مفتاح لكل نية مستخدم (ضغطة)، يُعاد نفسه عند إعادة المحاولة الشبكية. 8–128 حرفًا، UUIDv4 مفضل. يُحفظ 24 ساعة لكل مستخدم.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: اختياري لهذا المسار؛ إذا أُرسل يُطبق بنفس الدلالة.
      schema:
        type: string
        minLength: 8
        maxLength: 128
