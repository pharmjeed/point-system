        city: {type: [string, 'null']}
        photo_count: {type: integer, minimum: 0}
        subscriptions_enabled: {type: boolean}
        pay_per_visit_halalas: {type: [integer, 'null']}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
      required: [venue_id, venue, org, status, category, city, photo_count, subscriptions_enabled, pay_per_visit_halalas, version, updated_at]
