  /metrics:
    get:
      operationId: metrics
      summary: مقاييس Prometheus (شبكة داخلية فقط)
      tags: [Health]
      description: مقاييس Prometheus (شبكة داخلية فقط)
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security: []
      x-permission: public
      x-idempotency: none
      x-rate-limit-class: health
      x-error-codes: []
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-point_sid
      description: رمز معتم 256-bit؛ httpOnly; Secure; SameSite=Lax; Path=/. الخادم يخزن sha256 فقط في auth_sessions.token_hash
    csrfHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: قيمته point-web على كل POST/PUT/PATCH، مع فحص Origin مقابل APP_BASE_URL
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
