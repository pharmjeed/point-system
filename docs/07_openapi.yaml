      x-domain-events: [ticket.reparking, task.canceled, task.created, incident.opened, incident.resolved]
      x-ws-events: [task.updated, ticket.updated]
      x-whatsapp: [W-08]
  /v1/tickets/{ticketId}/custody-transfers:
    post:
      operationId: transferCustody
      summary: نقل عهدة رسمي
      tags: [Retrieval & Handover]
      description: |-
        توثيق تسليم مركبة أو مفتاح من حائزه الحالي (يستنتجه الخادم من التذكرة) إلى حائز جديد. إن كانت للتذكرة مهمة accepted أو in_progress وانتقلت العهدة لسائق آخر: المهمة تنتقل إليه بنفس حالتها (task.reassigned، trigger=custody_transfer، مع from_status وtarget=driver) بشرط ألا تكون لديه حركة نشطة (MOVEMENT_IN_PROGRESS)، فيغادر التوفر وتُسحب عروضه الفردية الحية، ويُسوّى السائق السابق (ترقية مهمته التالية أو يصبح متاحًا) مع تمريرة توزيع تحت قفل المجموعة (الملف 11 §2.4، DEC-251). وصول المفتاح إلى مكلّف مهمة إحضار accepted — مكلّفها الحالي، أو السائق الذي ينقل إليه النقلُ نفسه المهمة — يضبط key_picked_up_at مع task.key_picked_up بـkey_slot_id=null (ما لم يكن الاستلام مضبوطًا قبل النقل، فيبقى وقته بلا حدث جديد)، وخروجه من المكلّف قبل البدء يعيده null بلا حدث، فلا يرد start-retrieval بـKEY_NOT_PICKED_UP بعد مفتاح حائزه unknown وصل بهذا النقل (DEC-187، DEC-251).

        الشروط (DEC-250): لا customer (VALIDATION_FAILED بـuse_handover) · المركبة إلى driver/spot/supervisor/unknown والمفتاح إلى driver/key_slot/supervisor/unknown (not_allowed_for_subject) · المركبة parked إلى spot أو unknown فقط (parked_vehicle_spot_or_unknown) · الحائز السائق نشط في مناوبة on_duty بمجموعة التذكرة (driver_not_on_duty، not_a_driver)، والمشرف نشط بنطاق الموقع · السبب note لحدث العهدة · قفل المجموعة دائمًا

        الأثر: custody_events(official_transfer) + حقول الحائز الحالي (+ نقل المهمة وتسوية السائق السابق عند الحاجة)
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  $ref: '#/components/schemas/CustodySubject'
                to_holder_type:
                  $ref: '#/components/schemas/CustodyHolderType'
                to_holder_id:
                  type: [string, 'null']
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
              required: [subject, to_holder_type, reason]
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodyEventEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND | TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: CUSTODY_HOLDER_MISMATCH | IDEMPOTENCY_IN_PROGRESS | KEY_SLOT_OCCUPIED | MOVEMENT_IN_PROGRESS | PARKING_SPOT_OCCUPIED | TICKET_CLOSED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.custody_transfer
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [CUSTODY_HOLDER_MISMATCH, KEY_SLOT_OCCUPIED, MOVEMENT_IN_PROGRESS, PARKING_SPOT_OCCUPIED, REASON_REQUIRED, RESOURCE_NOT_FOUND, TICKET_CLOSED, TICKET_NOT_FOUND]
      x-domain-events: [custody.changed, task.reassigned, driver.availability_changed, task.key_picked_up, task.promoted, offer.revoked]
      x-ws-events: [ticket.updated, task.updated, driver.state_changed]
  /v1/tickets/{ticketId}/manual-reconcile:
    post:
      operationId: manualReconcile
      summary: مطابقة يدوية بعد انقطاع
      tags: [Retrieval & Handover]
      description: |-
        بعد عودة النظام من تعطل كلي: يضبط الحالة النهائية من السجل الورقي المرقّم. لا تُشغّل أوامر مؤجلة ولا تُرسل رسائل عميل قديمة.

        الشروط: أي حالة مفتوحة ومنها parked ← parked للتصحيح؛ النهائية ← INVALID_STATE_TRANSITION (reason=ticket_closed)؛ الموقف والملاحظة والخانة لـparked فقط؛ الورقية بلا كعب إلى voided فقط؛ incident_id من موقع التذكرة وليس لتذكرة أخرى (DEC-253) · الدفع (DEC-252): delivered لتذكرة due يتطلب payment (بـcollected_by) أو إعفاءً سابقًا وإلا PAYMENT_PENDING؛ payment لـdelivered ولـdue فقط (not_applicable) وقواعد 13 §5؛ التحصيل المسجل يمنع voided (reason=payment_recorded)

        الأثر: حالة نهائية + custody_events(manual_reconcile، note = paper_log_ref) + ticket_events(data.manual=true) + كبت رسائل واتساب (المعلّقة بلا محاولة جارية ← skipped superseded) + رموز التسليم الحية canceled مع مسح نسختها، ورموز الربط والإجراء لـvoided فقط + تسوية سائق الحركة الملغاة + إسقاط الطلب المبكر المعلّق + حل تنبيهات الحالة السابقة (DEC-253)؛ payment.recorded بـsource=reconcile مع تدقيق payment.record (DEC-252)
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_status:
                  type: string
                  enum: [parked, delivered, voided]
                  description: قيم من TicketStatus
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
                evidence:
                  type: object
                  properties:
                    paper_log_ref:
                      type: string
                      maxLength: 60
                      description: 'سطر السجل الورقي المطبوع بصيغة P<الصفحة>-R<السطر> بخانتين لكلٍّ، مثل P03-R12؛ صيغة النموذج لا يفرضها الخادم (DEC-403)'
                      examples: [P03-R12]
                    note:
                      type: string
                      maxLength: 500
                      description: 'كل أسطر المركبة نفسها في السجل، والوقت الفعلي ومن استلم أو سلّم حين يختلف عن قيد النظام (DEC-403، DEC-404)'
                  required: [paper_log_ref]
                parking_spot_id:
                  type: [string, 'null']
                  format: uuid
                spot_note:
                  type: [string, 'null']
                key_slot_id:
                  type: [string, 'null']
                  format: uuid
                incident_id:
                  type: [string, 'null']
                  format: uuid
                payment:
                  anyOf:
                  - $ref: '#/components/schemas/PaymentInputAttributed'
                  - type: 'null'
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
              required: [target_status, reason, evidence]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND | TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | KEY_SLOT_OCCUPIED | PARKING_SPOT_OCCUPIED | PAYMENT_ALREADY_RECORDED | PAYMENT_PENDING | VERSION_CONFLICT
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PAYMENT_AMOUNT_MISMATCH | PAYMENT_METHOD_NOT_ALLOWED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.manual_reconcile
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [INVALID_STATE_TRANSITION, KEY_SLOT_OCCUPIED, PARKING_SPOT_OCCUPIED, PAYMENT_ALREADY_RECORDED, PAYMENT_AMOUNT_MISMATCH, PAYMENT_METHOD_NOT_ALLOWED, PAYMENT_PENDING, REASON_REQUIRED, RESOURCE_NOT_FOUND, TICKET_NOT_FOUND, VERSION_CONFLICT]
      x-domain-events: [ticket.manually_reconciled, custody.changed, task.canceled, payment.recorded]
      x-ws-events: [ticket.updated]
  /v1/tickets/{ticketId}/payments:
    post:
      operationId: recordPayment
      summary: تسجيل التحصيل
      tags: [Payments]
      description: |-
        عادةً يُرسل ضمن /handover؛ هذا المسار للتحصيل قبل التسليم مباشرة. لا بيانات بطاقات.

        الشروط: payment_status=due · ticket.status=ready · المكلّف بمهمة الإحضار

        الأثر: payments(recorded) + payment_status=collected

        الحالة المالية (DEC-282): not_required أو waived ← INVALID_STATE_TRANSITION (current_status = payment_status، allowed_from [due]، reason payment_not_required أو payment_waived)؛ collected ← PAYMENT_ALREADY_RECORDED. pos_reference يُطبّع ويُفحص في الجسم (13 §5.6، DEC-280). الحفل المغلق ← EVENT_ALREADY_CLOSED (دفاعي: لا تذكرة ready في حفل مغلق).
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payment:
                        $ref: '#/components/schemas/Payment'
                      ticket:
                        $ref: '#/components/schemas/TicketSummary'
                    required: [payment, ticket]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | NOT_TASK_ASSIGNEE | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: EVENT_ALREADY_CLOSED | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | PAYMENT_ALREADY_RECORDED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PAYMENT_AMOUNT_MISMATCH | PAYMENT_METHOD_NOT_ALLOWED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: payment.record
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [EVENT_ALREADY_CLOSED, INVALID_STATE_TRANSITION, NOT_TASK_ASSIGNEE, PAYMENT_ALREADY_RECORDED, PAYMENT_AMOUNT_MISMATCH, PAYMENT_METHOD_NOT_ALLOWED, TICKET_NOT_FOUND]
      x-domain-events: [payment.recorded]
      x-ws-events: [ticket.updated]
  /v1/payments/{paymentId}/reverse:
    post:
      operationId: reversePayment
      summary: عكس تحصيل
      tags: [Payments]
      description: |-
        replacement اختياري لتصحيح الوسيلة أو المرجع: يُعكس الأصل ويُدرج تحصيل جديد recorded بقيم البديل مع نسخ collected_by وcollected_at من الأصل، فتبقى payment_status=collected (الملف 13).

        الأثر: دون بديل: payments.status=reversed + payment_status=due؛ إذا التذكرة مسلّمة تُفتح واقعة payment_discrepancy. مع بديل: عكس + تحصيل جديد وتبقى collected

        الشروط (DEC-276، DEC-281، DEC-282): التحصيل خارج النطاق ← RESOURCE_NOT_FOUND (payment)؛ الحفل المغلق ← EVENT_ALREADY_CLOSED؛ المعكوس ← PAYMENT_ALREADY_REVERSED؛ تذكرة ليست collected ← INVALID_STATE_TRANSITION (reason payment_integrity)؛ بديل بالوسيلة والمرجع المطبّع نفسيهما ← VALIDATION_FAILED (replacement، no_change)، وحقوله بالبادئة replacement.، ويُدرج بعد عكس الأصل وينسخ collected_by وcycle_id وcollected_at. العكس بلا بديل على تذكرة مسلّمة يفتح واقعة payment_discrepancy مرتبطة بها (incident.opened بـauto_created: true، DEC-284).
      parameters:
      - $ref: '#/components/parameters/paymentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
                replacement:
                  anyOf:
                  - $ref: '#/components/schemas/PaymentInput'
                  - type: 'null'
              required: [reason]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reversed:
                        $ref: '#/components/schemas/Payment'
                      replacement:
                        anyOf:
                        - $ref: '#/components/schemas/Payment'
                        - type: 'null'
                    required: [reversed]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: EVENT_ALREADY_CLOSED | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | PAYMENT_ALREADY_REVERSED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PAYMENT_AMOUNT_MISMATCH | PAYMENT_METHOD_NOT_ALLOWED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: payment.reverse
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [EVENT_ALREADY_CLOSED, INVALID_STATE_TRANSITION, PAYMENT_ALREADY_REVERSED, PAYMENT_AMOUNT_MISMATCH, PAYMENT_METHOD_NOT_ALLOWED, REASON_REQUIRED, RESOURCE_NOT_FOUND]
      x-domain-events: [payment.reversed, payment.recorded, incident.opened]
      x-ws-events: [ticket.updated]
  /v1/tickets/{ticketId}/payment-waiver:
    post:
      operationId: waivePayment
      summary: إعفاء من الرسوم
      tags: [Payments]
      description: |-
        الشروط: payment_status=due

