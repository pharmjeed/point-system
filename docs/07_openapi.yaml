      description: |-
        إنشاء مواقف (جماعي)

        القواعد (DEC-114): labels أو range واحد بالضبط، وإلا VALIDATION_FAILED بالمشكلة labels_or_range؛ حتى 500 تسمية، والتسمية تُقص وحدها 20 حرفًا؛ range.prefix يُقص، ومع بادئة غير فارغة يُكمَّل الرقم بأصفار إلى عدد خانات to (A-01…A-30) ودونها أرقام مجردة؛ التكرار داخل الطلب أو مع الموجود في المنطقة يرفض الطلب كله في VALIDATION_FAILED واحد بحقول labels.<i> أو range مع index وlabel (وduplicate_of للتكرار داخل الطلب).
