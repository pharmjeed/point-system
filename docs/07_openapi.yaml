        PAYMENT_AMOUNT_MISMATCH, PAYMENT_METHOD_NOT_ALLOWED, PAYMENT_PENDING, PERMISSION_DENIED, PHONE_INVALID, PLATE_INVALID, RATE_LIMITED, REASON_REQUIRED, REASSIGN_BLOCKED_MOVEMENT,
