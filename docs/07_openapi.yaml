          description: AUTH_UNAUTHENTICATED | AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED
        '403':
          $ref: '#/components/responses/CustomerError'
          description: AUTH_ACCOUNT_DISABLED
        '410':
          $ref: '#/components/responses/CustomerError'
          description: ACCOUNT_DELETED | CUSTOMER_OTP_EXPIRED
        '413':
          $ref: '#/components/responses/CustomerError'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/CustomerError'
          description: CUSTOMER_OTP_INVALID | VALIDATION_FAILED
        '423':
          $ref: '#/components/responses/CustomerError'
          description: CUSTOMER_OTP_LOCKED
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/CustomerError'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/CustomerError'
          description: SERVICE_UNAVAILABLE
      security:
      - customerBearer: []
      x-permission: customer
      x-idempotency: none
      x-rate-limit-class: auth
      x-error-codes: [ACCOUNT_DELETED, AUTH_ACCOUNT_DISABLED, AUTH_SESSION_EXPIRED, AUTH_SESSION_REVOKED, AUTH_UNAUTHENTICATED, CUSTOMER_OTP_EXPIRED, CUSTOMER_OTP_INVALID, CUSTOMER_OTP_LOCKED]
