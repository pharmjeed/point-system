        C-18 (V2-023، DEC-524): البطاقات المحفوظة للحساب (العلامة وآخر 4 أرقام والانتهاء فقط، لا رمز البوابة)، الافتراضية أولًا؛ لا تظهر بطاقة حُفظت مع دفعة لم تنجح بعد.
      responses:
