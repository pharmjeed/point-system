          type: integer
          minimum: 0
          description: 0 لإنشاء الملف
        category:
          $ref: '#/components/schemas/VenueCategory'
        address: {type: [string, 'null'], maxLength: 200}
        city: {type: [string, 'null'], maxLength: 80}
        lat: {type: [number, 'null'], minimum: -90, maximum: 90}
        lng: {type: [number, 'null'], minimum: -180, maximum: 180, description: مع lat معًا أو لا شيء}
        opening_hours:
          $ref: '#/components/schemas/OpeningHours'
        photo_ids:
          type: array
          maxItems: 6
          uniqueItems: true
          items: {type: string, format: uuid}
      required: [expected_version, category, address, city, lat, lng, opening_hours, photo_ids]
