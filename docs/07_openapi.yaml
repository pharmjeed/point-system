          description: AUTH_UNAUTHENTICATED | AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED
        '403':
          $ref: '#/components/responses/CustomerError'
          description: AUTH_ACCOUNT_DISABLED
        '410':
          $ref: '#/components/responses/CustomerError'
          description: ACCOUNT_DELETED
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/CustomerError'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/CustomerError'
          description: SERVICE_UNAVAILABLE
      security:
      - customerBearer: []
      x-permission: customer
      x-idempotency: none
      x-rate-limit-class: read
      x-error-codes: [ACCOUNT_DELETED, AUTH_ACCOUNT_DISABLED, AUTH_SESSION_EXPIRED, AUTH_SESSION_REVOKED, AUTH_UNAUTHENTICATED]
  # --- end V2-013 ---
  # --- V2-022 / V2-023 (DEC-521 … DEC-525): paying a visit (C-10/C-12) and the saved cards (C-18) ---
  /v1/customer/visits/{ticketId}/pay:
    post:
      operationId: customerVisitPay
      summary: دفع الزيارة في التطبيق (C-12 / C-10)
      tags: [Customer]
      description: |-
        C-12 → C-10 (V2-022، DEC-521): جلسة دفع لزيارة الحساب نفسه (تذكرة صفّ customers المربوط بالحساب، DEC-504). البطاقة تُرمَّز على الجهاز بالمفتاح العام (Moyasar POST /v1/tokens) أو رمز Apple Pay، والخادم يرسل الرمز وحده (SAQ-A، DEC-510). المبلغ يحدده الخادم: رسوم التذكرة (لقطة الحفل per_vehicle، شاملة الضريبة 15%) — ما يحصّله السائق نقدًا تمامًا؛ وسعر الموقع العام للعرض فقط. يُرفض: تذكرة حساب آخر أو غير موجودة RESOURCE_NOT_FOUND (resource: visit)؛ مسلّمة أو ملغاة أو مشمولة أو مُعفاة أو أقل من 1.00 ريال VISIT_NOT_PAYABLE (reason)؛ مدفوعة في التطبيق أو نقدًا/شبكة PAYMENT_ALREADY_RECORDED؛ دفعة سابقة تنتظر 3-D Secure PAYMENT_IN_PROGRESS (online_payment_id، retry_after_s)؛ الرفض من البوابة PAYMENT_FAILED بعد حفظ failed. save_card يحفظ البطاقة بعد نجاح هذه الدفعة فقط ويلزمه card_on_file_version الساري (CUSTOMER_CONSENT_REQUIRED / CUSTOMER_CONSENT_VERSION_STALE). الرد status (paid أو initiated مع transaction_url لصفحة 3-D Secure يفتحها التطبيق في متصفح داخلي حتى callback_url، أو failed)؛ العودة لا تغيّر شيئًا والحالة النهائية من Webhook البوابة بعد قراءتها (DEC-512)، يتابعها التطبيق بـGET /v1/customer/payments/{paymentId}. مفتاح التكرار نفسه لا ينشئ إلا دفعة واحدة (given_id مشتق منه).

        الأثر: online_payments (initiated ثم الحالة من البوابة) + customer_account_consents/customer_payment_methods (save_card) + platform_audit_log/audit_log/customer_audit_log؛ عند paid: tickets.payment_status = collected وentitlement = app_paid + ticket_events/outbox payment.online_paid
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  oneOf:
                  - type: object
                    properties:
                      type: {type: string, enum: [token]}
                      token: {type: string, pattern: '^[A-Za-z0-9_-]{8,128}$'}
                    required: [type, token]
                    additionalProperties: false
                  - type: object
                    properties:
                      type: {type: string, enum: [applepay]}
                      token: {type: string, minLength: 1, maxLength: 16000}
                    required: [type, token]
                    additionalProperties: false
                  - type: object
                    properties:
                      type: {type: string, enum: [saved]}
                      payment_method_id: {type: string, format: uuid}
                    required: [type, payment_method_id]
                    additionalProperties: false
                save_card:
                  type: boolean
                card_on_file_version:
                  type: string
                  maxLength: 40
              required: [source]
              additionalProperties: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerVisitPaymentEnvelope'
        '401':
          $ref: '#/components/responses/CustomerError'
          description: AUTH_UNAUTHENTICATED | AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED
        '402':
          $ref: '#/components/responses/CustomerError'
          description: PAYMENT_FAILED
        '403':
          $ref: '#/components/responses/CustomerError'
          description: AUTH_ACCOUNT_DISABLED
        '404':
          $ref: '#/components/responses/CustomerError'
          description: RESOURCE_NOT_FOUND
        '409':
          $ref: '#/components/responses/CustomerError'
          description: IDEMPOTENCY_IN_PROGRESS | PAYMENT_ALREADY_RECORDED | VISIT_NOT_PAYABLE | PAYMENT_IN_PROGRESS | CUSTOMER_CONSENT_VERSION_STALE
        '410':
          $ref: '#/components/responses/CustomerError'
          description: ACCOUNT_DELETED
        '413':
          $ref: '#/components/responses/CustomerError'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/CustomerError'
          description: VALIDATION_FAILED | IDEMPOTENCY_KEY_REUSED | CUSTOMER_CONSENT_REQUIRED
        '428':
          $ref: '#/components/responses/CustomerError'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/CustomerError'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/CustomerError'
          description: SERVICE_UNAVAILABLE
        '504':
          $ref: '#/components/responses/CustomerError'
          description: DEPENDENCY_TIMEOUT
      security:
      - customerBearer: []
      x-permission: customer
      x-idempotency: required
      x-rate-limit-class: write
      x-error-codes: [ACCOUNT_DELETED, AUTH_ACCOUNT_DISABLED, AUTH_SESSION_EXPIRED, AUTH_SESSION_REVOKED, AUTH_UNAUTHENTICATED, CUSTOMER_CONSENT_REQUIRED, CUSTOMER_CONSENT_VERSION_STALE, DEPENDENCY_TIMEOUT, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, PAYMENT_ALREADY_RECORDED, PAYMENT_FAILED, PAYMENT_IN_PROGRESS, RESOURCE_NOT_FOUND, VISIT_NOT_PAYABLE]
