  /v1/customer/locations:
    get:
      operationId: customerLocations
      summary: المواقع المدرجة
      tags: [Customer]
      description: |-
        C-07: ملف عام معتمد لموقع نشط لمشغل نشط (operator_status = active) فقط. بحث بالاسم أو المدينة، تصفية، ترتيب بالمسافة إن أُعطي الموقع وإلا بالاسم، ومؤشر meta.next_cursor. open_now بتوقيت الموقع على ساعة الخادم، والمبالغ بالهللة شاملة الضريبة.
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 60
      - name: filter
        in: query
        schema:
          type: string
          enum: [subscribed, subscribable, open_now]
      - name: lat
        in: query
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: lng
        in: query
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLocationListEnvelope'
