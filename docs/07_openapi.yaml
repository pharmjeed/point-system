  /v1/telemetry:
    post:
      operationId: postTelemetry
      summary: دفعة قياسات العميل
      tags: [Admin]
      description: |-
        الأثر: analytics_events(source=client)

        ليس أمرًا: بلا Idempotency-Key ولا صف تدقيق، ويرد 202 بلا جسم من معاملته الخاصة (DEC-149). ترد مشكلات الدفعة وحدها: VALIDATION_FAILED للشكل، أو أكثر من 50 حدثًا، أو جسم أكبر من 64 KB ((body) بالمشكلة too_large)، أو جهاز ليس من أجهزة المستخدم غير الملغاة (device_id بالمشكلة not_owned)؛ وRATE_LIMITED فوق 120 حدثًا في الدقيقة لكل مستخدم وجهاز. الحدث غير الصالح يُسقط ويُعد في point_analytics_rejected_total{source="client",reason} ولا يُفشل الدفعة (DEC-148، 15 §9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: [string, 'null']
                  format: uuid
                client_session_id:
                  type: [string, 'null']
                  description: معرّف جلسة العميل في المتصفح (الملف 15 §8)
                  maxLength: 64
                app_version:
                  type: string
                  maxLength: 32
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/TelemetryEvent'
                  minItems: 1
                  maxItems: 50
              required: [app_version, events]
              additionalProperties: false
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: telemetry.write
      x-idempotency: none
      x-rate-limit-class: device
      x-error-codes: []
