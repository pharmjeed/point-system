          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: CUSTODY_OPEN | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | VERSION_CONFLICT
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.void
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [CUSTODY_OPEN, INVALID_STATE_TRANSITION, REASON_REQUIRED, TICKET_NOT_FOUND, VERSION_CONFLICT]
