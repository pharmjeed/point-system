  /v1/drivers/{driverId}/transfers:
    post:
      operationId: transferDriver
      summary: نقل سائق بين موقعين
      tags: [Drivers & Staff]
      description: |-
        فوري (scheduled_at فارغ أو ماضٍ) أو مجدول. يُمنع مع مركبة أو مفتاح بعهدته أو مهمة in_progress أو مهمة صف/إعادة صف نشطة (DEC-32): الفوري يعيد TRANSFER_BLOCKED_CUSTODY دون إنشاء سجل نقل، والمجدول يصبح عند تفعيله blocked مع تنبيه transfer_blocked ويُعاد تقييمه آليًا. المهمة التالية المحجوزة ومهمة الإحضار المقبولة قبل استلام المفتاح تعودان لطابور الموقع القديم بأولويتهما. عند الإتمام: إبطال العروض، إعادة المهمة التالية لطابور الموقع القديم، إنهاء المناوبة والتعيين القديم وفتح الجديد، إبطال الجلسات ومغادرة الغرف. السجلات القديمة لا تُعاد كتابتها.

        الشروط: المشرف يملك نطاق الموقعين (TRANSFER_SCOPE_DENIED بـmissing_venue_id) · لا نقل مفتوح آخر · الهدف ليس الموقع الحالي (VALIDATION_FAILED: to_venue_id same_as_current) · تغيّر التعيين المتزامن ← ASSIGNMENT_CONFLICT (assignment_changed) · سائق عُطّل قبل التفعيل ← النقل canceled · الأقفال L1 لكل مجموعات الموقعين تصاعديًا ثم L3 (DEC-224، DEC-225)
      parameters:
      - $ref: '#/components/parameters/driverId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_venue_id:
                  type: string
                  format: uuid
                scheduled_at:
                  type: [string, 'null']
                  format: date-time
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
              required: [to_venue_id, reason]
              additionalProperties: false
            examples:
              now:
                summary: نقل فوري
                value:
                  to_venue_id: c2b0b8d4-3f7a-4e21-8c55-1d2e3f4a5b6c
                  reason: تغطية حفل ليلتي
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverTransferEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED | TRANSFER_SCOPE_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: ASSIGNMENT_CONFLICT | DRIVER_DISABLED | IDEMPOTENCY_IN_PROGRESS | TRANSFER_ALREADY_PENDING | TRANSFER_BLOCKED_CUSTODY
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: driver.transfer
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [ASSIGNMENT_CONFLICT, DRIVER_DISABLED, REASON_REQUIRED, TRANSFER_ALREADY_PENDING, TRANSFER_BLOCKED_CUSTODY, TRANSFER_SCOPE_DENIED]
      x-domain-events: [driver.transfer_requested, driver.transferred, driver.transfer_blocked, task.withdrawn, offer.revoked, driver.duty_ended]
      x-ws-events: [session.revoked, driver.state_changed]
