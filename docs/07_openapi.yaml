        digits:
          type: [string, 'null']
          description: حتى 4 أرقام لاتينية
          pattern: ^[0-9]{1,4}$
        letters_ar:
          type: [string, 'null']
          description: 3 أحرف عربية من أحرف اللوحات السعودية مفصولة بمسافة
          examples: [ب ح د]
        letters_en:
          type: [string, 'null']
          description: المقابل اللاتيني
          examples: [B J D]
        raw:
          type: [string, 'null']
          description: للوحات غير السعودية أو الحرة
        display:
          type: string
          description: نص العرض المحسوب
          examples: [1234 ب ح د]
      required: [country, display]
    PlateInput:
      type: object
      properties:
        country:
          type: string
          default: SA
        digits:
          type: string
          pattern: ^[0-9]{1,4}$
        letters_ar:
          type: string
          description: '3 أحرف من: ا ب ح د ر س ص ط ع ق ك ل م ن ه و ى'
        letters_en:
          type: string
          description: اختياري؛ يُشتق من letters_ar إن لم يُرسل
        raw:
          type: string
          description: إلزامي عندما country != SA
      description: 'SA: digits + letters_ar إلزاميان؛ غير ذلك raw. الخطأ PLATE_INVALID'
      additionalProperties: false
