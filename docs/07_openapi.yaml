        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.intake
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [INVALID_STATE_TRANSITION, MEDIA_TOO_LARGE, MEDIA_TYPE_UNSUPPORTED, TICKET_NOT_FOUND]
  /v1/media/{mediaId}/complete:
    post:
      operationId: completeMediaUpload
      summary: تأكيد اكتمال رفع الصورة
      tags: [Intake & Tickets]
      description: |-
        يتحقق الخادم من وجود الكائن وأن حجمه وهاشه يطابقان المُعلن، ثم يزيل بيانات EXIF والموقع (DEC-36) ويحفظ النسخة المنقّاة بحجمها وهاشها الجديدين.

        الأثر: upload_status=uploaded بعد التنقية؛ الكائن الأصلي غير المنقّى لا يبقى؛ ticket_events(ticket.photo_uploaded) دون زيادة إصدار التذكرة (DEC-95). WS ticket.updated عند الإكمال المتأخر للفحص فقط (ticket.inspection_completed)؛ الصورة العادية بلا حدث نطاقي ولا نشر فوري.
      parameters:
      - $ref: '#/components/parameters/mediaId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
