                kind:
                  $ref: '#/components/schemas/ExportKind'
                filters:
                  type: object
                  properties:
                    venue_id:
                      type: string
                      format: uuid
                    event_id:
                      type: string
                      format: uuid
                    from:
                      type: string
                      format: date-time
                    to:
                      type: string
                      format: date-time
                  additionalProperties: false
              required: [kind, filters]
              additionalProperties: false
      responses:
