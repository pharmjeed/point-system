  /webhooks/whatsapp:
    get:
      operationId: verifyWhatsAppWebhook
      summary: تحقق إعداد Webhook من Meta
      tags: [Webhooks]
      description: يقارن hub.verify_token بالسر (مقارنة زمن ثابت) ويعيد hub.challenge نصًا.
      parameters:
      - name: hub.mode
        in: query
        required: true
        schema:
          type: string
          const: subscribe
      - name: hub.verify_token
        in: query
        required: true
        schema:
          type: string
      - name: hub.challenge
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                description: يُعاد hub.challenge كما هو
        '403':
          $ref: '#/components/responses/Error'
          description: WA_WEBHOOK_VERIFY_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security: []
      x-permission: public
      x-idempotency: none
      x-rate-limit-class: webhook
      x-error-codes: [WA_WEBHOOK_VERIFY_FAILED]
    post:
      operationId: receiveWhatsAppWebhook
      summary: استقبال رسائل وحالات واتساب
      tags: [Webhooks]
      description: |-
        يُقرأ الجسم الخام قبل التحليل ويُتحقق من X-Hub-Signature-256 = sha256=HMAC(app_secret, raw_body) بمقارنة زمن ثابت. يُحفظ في whatsapp_inbound_events (body_sha256 فريد) مع job.wa_process_inbound في نفس المعاملة ثم 200 سريع. إن تعذر الحفظ يُعاد 5xx ليعيد المزود المحاولة. المعالجة لاحقًا بالعامل.

        الأثر: whatsapp_inbound_events(pending) + outbox job.wa_process_inbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhookPayload'
            examples:
              button:
                summary: ضغط زر «طلب السيارة»
                value:
                  object: whatsapp_business_account
                  entry:
                  - id: WABA_ID
                    changes:
                    - field: messages
                      value:
                        messaging_product: whatsapp
                        metadata:
                          display_phone_number: 9665XXXXXXXX
                          phone_number_id: PHONE_NUMBER_ID
                        contacts:
                        - wa_id: '966551234567'
                          profile:
                            name: عبدالله
                        messages:
                        - from: '966551234567'
                          id: wamid.HBgM...
                          timestamp: '1793124000'
                          type: button
                          context:
                            from: 9665XXXXXXXX
                            id: wamid.TEMPLATE...
                          button:
                            payload: rq_9mF2kQ...opaque
                            text: طلب السيارة
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Error'
          description: WA_WEBHOOK_SIGNATURE_INVALID
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security: []
      x-permission: public
      x-idempotency: none
      x-rate-limit-class: webhook
      x-error-codes: [WA_WEBHOOK_SIGNATURE_INVALID]
      x-domain-events: [wa.inbound_received]
      parameters:
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha256=[a-f0-9]{64}$
  /webhooks/payments/moyasar:
    post:
      operationId: receivePaymentWebhook
      summary: استقبال أحداث بوابة الدفع (Moyasar)
      tags: [Webhooks]
      description: |-
        V2-021 (DEC-511، DEC-512): يُقرأ الجسم الخام قبل التحليل، ويُقارن secret_token فيه (سر الـWebhook المشترك الذي يُضبط لدى البوابة، MOYASAR_WEBHOOK_SECRET_REF والسابق أثناء التدوير) بمقارنة زمن ثابت؛ لا توقيع ترويسة لدى Moyasar. يُحفظ الحدث مرة لكل (gateway, event_id) بلا السر وببيانات البطاقة مختزلة إلى العلامة وآخر 4 أرقام، مع job.payment_webhook_process في المعاملة نفسها، ثم 200 بلا جسم (والمكرر كذلك). العامل يقرأ الدفعة من البوابة ثم يطبقها بالانتقالات الأمامية فقط؛ عودة العميل من صفحة 3-D Secure لا تغيّر شيئًا وحدها.

        الأثر: gateway_webhook_events + outbox job.payment_webhook_process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
            examples:
              paid:
                summary: دفعة ناجحة
                value:
                  id: 6d5f1a2c-0d8e-4b1e-9a43-1f0f6d1c2b3a
                  type: payment_paid
                  created_at: '2026-11-08T12:00:00.000Z'
                  secret_token: WEBHOOK_SHARED_SECRET
                  account_name: POINT
                  live: false
                  data:
                    id: 0b2f3a4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
                    status: paid
                    amount: 2300
                    currency: SAR
                    refunded: 0
                    metadata:
                      online_payment_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Error'
          description: PAYMENT_WEBHOOK_SIGNATURE_INVALID
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: VALIDATION_FAILED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security: []
      x-permission: public
      x-idempotency: none
      x-rate-limit-class: webhook
      x-error-codes: [PAYMENT_WEBHOOK_SIGNATURE_INVALID]
