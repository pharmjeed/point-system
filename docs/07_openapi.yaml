        الأثر: delivered + الدورة outcome=delivered + عهدة → customer + الرمز consumed + W-06 + ترقية التالية أو available

        بوابة الدفع (DEC-277، DEC-278): خطاف التحصيل المضمّن يفحص بلا أثر قبل الرمز أو الكعب، فلا يستهلك خطأ مالي محاولة: due بلا payment ← PAYMENT_PENDING؛ due مع payment ← قواعد 13 §5.2 (حقول payment.*)؛ collected مع payment ← PAYMENT_ALREADY_RECORDED {payment_id, method, collected_by}؛ not_required أو waived مع payment ← VALIDATION_FAILED (payment، not_applicable). يُقفل الحفل FOR SHARE بعد المجموعة فقط حين تكون التذكرة due أو يُرسل payment، ويُسجَّل التحصيل بعد نجاح التحقق في معاملة التسليم.
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verification:
                  oneOf:
                  - type: object
                    properties:
                      method:
                        type: string
                        const: code
                      code:
                        type: string
                        pattern: ^[0-9]{6}$
                    required: [method, code]
                    additionalProperties: false
                  - type: object
                    properties:
                      method:
                        type: string
                        const: paper_stub
                      paper_serial:
                        type: string
                        maxLength: 20
                    required: [method, paper_serial]
                    additionalProperties: false
                payment:
                  anyOf:
                  - $ref: '#/components/schemas/PaymentInput'
                  - type: 'null'
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
              required: [verification]
              additionalProperties: false
            examples:
              code_cash:
                summary: رمز + تحصيل نقدي
                value:
                  verification:
                    method: code
                    code: '482731'
                  payment:
                    method: cash
                    amount_halalas: 2000
              code_included:
                summary: رمز (خدمة مشمولة)
                value:
                  verification:
                    method: code
                    code: '482731'
              paper:
                summary: تذكرة ورقية
                value:
                  verification:
                    method: paper_stub
                    paper_serial: A-0457
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket:
                        $ref: '#/components/schemas/TicketDetail'
                      cycle:
                        $ref: '#/components/schemas/RetrievalCycle'
                      payment:
                        anyOf:
                        - $ref: '#/components/schemas/Payment'
                        - type: 'null'
                      driver:
                        $ref: '#/components/schemas/DriverStateResult'
                    required: [ticket, cycle, driver]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | NOT_TASK_ASSIGNEE | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: CUSTODY_HOLDER_MISMATCH | HANDOVER_CODE_CONSUMED | HANDOVER_NOT_READY | IDEMPOTENCY_IN_PROGRESS | PAYMENT_ALREADY_RECORDED | PAYMENT_PENDING | TICKET_CLOSED | VERSION_CONFLICT
        '410':
          $ref: '#/components/responses/Error'
          description: HANDOVER_CODE_EXPIRED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: HANDOVER_CODE_INVALID | IDEMPOTENCY_KEY_REUSED | PAPER_STUB_MISMATCH | PAYMENT_AMOUNT_MISMATCH | PAYMENT_METHOD_NOT_ALLOWED | VALIDATION_FAILED
        '423':
          $ref: '#/components/responses/Error'
          description: HANDOVER_CODE_LOCKED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
