    post:
      operationId: platformCreateOperator
      summary: P-02 إضافة مشغل
      tags: [Platform]
      description: |-
        ينشئ صف organizations (operator_status = trial أو active، الاسم القانوني، السجل التجاري 10 أرقام، الرقم الضريبي 15 رقمًا 3…3) ومالكه الأول بمنطق create-owner نفسه (O-0001، نطاق org، must_change_secret، بلا TOTP: الدخول الأول يغيّر كلمة المرور ثم يعدّ MFA).
        كلمة المرور المؤقتة في هذا الرد مرة واحدة: لا تُحفظ نصًا ولا تُسجَّل ولا تدخل بيانات التدقيق؛ وإعادة الطلب بالمفتاح نفسه تعيد الرد بـtemporary_password = null (DEC-485). لإصدارها ثانية قبل أول دخول: POST /v1/platform/operators/{orgId}/owner/temporary-password.

        الشروط: جوال المالك غير مستخدم لدى أي مشغل ← وإلا VALIDATION_FAILED (owner.phone، in_use_by_another_operator؛ DEC-476، DEC-485)

        الأثر: organizations + users + role_scopes؛ platform_audit_log وaudit_log للمشغل (operator.create، owner.bootstrap)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name_ar:
                  type: string
                  minLength: 2
                  maxLength: 120
                name_en:
                  type: [string, 'null']
                  maxLength: 120
                legal_name:
                  type: string
                  minLength: 2
                  maxLength: 200
                cr_number:
                  type: [string, 'null']
                  pattern: '^[0-9]{10}$'
                vat_number:
                  type: [string, 'null']
                  pattern: '^3[0-9]{13}3$'
                operator_status:
                  type: string
                  enum: [trial, active]
                is_platform_operated:
                  type: boolean
                  default: false
                owner:
                  type: object
                  properties:
                    full_name:
                      type: string
                      minLength: 2
                      maxLength: 80
                    phone:
                      type: string
                      description: 05XXXXXXXX أو +9665XXXXXXXX
                  required: [full_name, phone]
                  additionalProperties: false
              required: [name_ar, legal_name, operator_status, owner]
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOperatorCreatedEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | PLATFORM_AUTH_REQUIRED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_ACCOUNT_DISABLED | AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PHONE_INVALID | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - platformSession: []
        csrfHeader: []
      x-permission: platform.operator_manage
      x-idempotency: required
      x-rate-limit-class: write
      x-error-codes: [AUTH_ACCOUNT_DISABLED, PERMISSION_DENIED, PHONE_INVALID, PLATFORM_AUTH_REQUIRED]
