components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-point_sid
      description: رمز معتم 256-bit؛ httpOnly; Secure; SameSite=Lax; Path=/. الخادم يخزن sha256 فقط في auth_sessions.token_hash
    platformSession:
      type: apiKey
      in: cookie
      name: __Host-point_psid
      description: الإصدار الثاني — جلسة لوحة المنصة (platform_sessions.token_hash = sha256)؛ منفصلة عن __Host-point_sid، فلا تفتح إحداهما مسارات الأخرى (DEC-462)
    customerBearer:
      type: http
      scheme: bearer
      description: الإصدار الثاني — رمز وصول العميل المعتم (pca.<session>.<secret>) 15 دقيقة في Authorization، sha256 فقط في customer_account_sessions؛ لا كوكي، فلا CSRF (لا اعتماد يرسله المتصفح تلقائيًا)، ولا تفتح جلسة موظف أو منصة مسارات العميل ولا العكس (DEC-497)
    csrfHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: قيمته point-web على كل POST/PUT/PATCH، مع فحص Origin مقابل APP_BASE_URL
