  /v1/customer/auth/otp:
    post:
      operationId: customerAuthOtp
      summary: طلب رمز الدخول على واتساب
      tags: [Customer]
      description: |-
        C-02 / C-03 «إعادة الإرسال» (V2-D11 كما عدّله DEC-460: واتساب فقط بقالب مصادقة AUTHENTICATION على رقم بوينت، بلا SMS؛ DEC-496).
        الرمز 6 أرقام يصلح 300 ث ويُخزَّن HMAC فقط مع نسخة مشفرة واحدة يرسلها العامل بعد COMMIT ثم تُمحى. إعادة الإرسال بعد 60 ث من وقت الخادم وإلا RATE_LIMITED مع retry_after_s، وحد لكل رقم ولكل جهاز في الساعة (scope: phone | device | resend). الرمز الجديد لا يعيد المحاولات.

        الأثر: customer_otp_challenges + outbox_events job.customer_otp_send + customer_audit_log في معاملة واحدة؛ لا اتصال بواتساب داخلها
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_e164:
                  type: string
                  pattern: '^\+9665[0-9]{8}$'
                  description: جوال سعودي فقط
                  examples: ['+966512345678']
                device_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: معرّف عشوائي ينشئه التطبيق مرة لكل تثبيت (حد المعدل لكل جهاز)
                platform:
                  type: string
                  enum: [ios, android]
                locale:
                  type: string
                  enum: [ar, en]
                  default: ar
                  description: لغة قالب المصادقة
              required: [phone_e164, device_id, platform]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOtpChallengeEnvelope'
        '413':
          $ref: '#/components/responses/CustomerError'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/CustomerError'
          description: PHONE_INVALID | VALIDATION_FAILED
        '423':
          $ref: '#/components/responses/CustomerError'
          description: CUSTOMER_OTP_LOCKED
        '429':
          $ref: '#/components/responses/CustomerRateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/CustomerError'
          description: INTERNAL_ERROR
        '503':
