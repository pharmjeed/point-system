          $ref: '#/components/responses/CustomerError'
          description: AUTH_UNAUTHENTICATED | AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED
        '403':
          $ref: '#/components/responses/CustomerError'
          description: AUTH_ACCOUNT_DISABLED | CUSTOMER_REAUTH_REQUIRED
        '409':
          $ref: '#/components/responses/CustomerError'
          description: CUSTOMER_ACCOUNT_VISIT_ACTIVE | IDEMPOTENCY_IN_PROGRESS
        '410':
          $ref: '#/components/responses/CustomerError'
          description: ACCOUNT_DELETED
        '413':
