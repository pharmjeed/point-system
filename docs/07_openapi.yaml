      x-rate-limit-class: command
      x-error-codes: [HANDOVER_CODE_LOCKED, HANDOVER_NOT_READY, NOT_TASK_ASSIGNEE, RESEND_LIMIT_REACHED, TICKET_NOT_FOUND, WA_CHANNEL_UNAVAILABLE, WA_CUSTOMER_OPTED_OUT, WA_NOT_LINKED, WA_TEMPLATE_NOT_APPROVED]
      x-domain-events: [handover.code_issued]
      x-ws-events: [ticket.updated]
      x-whatsapp: [W-05]
  /v1/tickets/{ticketId}/handover-exception:
    post:
      operationId: handoverException
      summary: تسليم استثنائي باعتماد المشرف
      tags: [Retrieval & Handover]
      description: |-
        للرمز المفقود/المقفل أو التذكرة الضائعة. يلزم تحقق هوية موثق بفحصين مستقلين على الأقل؛ رقم اللوحة وحده غير كافٍ. delivered_by يبقى السائق المكلّف والاعتماد للمشرف.

        الشروط: ticket.status=ready (التذكرة النهائية ← TICKET_CLOSED، DEC-210) · فحصان على الأقل من phone_last4 (يُحسب إن طابق الرقم المخزن؛ عدم التطابق أو بلا جوال ← VALIDATION_FAILED بـmismatch أو no_customer_phone)، plate_confirmed، vehicle_description_confirmed، document_note غير فارغ؛ اللوحة لا تكفي وحدها (insufficient_checks) (DEC-209) · بوابة الدفع بوابة التسليم بعد فحص الهوية وقبل إبطال الرمز، بلا أثر (DEC-210، DEC-277، DEC-278): due بلا payment ← PAYMENT_PENDING؛ due مع payment ← قواعد 13 §5.2 (حقول payment.*)؛ collected مع payment ← PAYMENT_ALREADY_RECORDED؛ not_required أو waived مع payment ← VALIDATION_FAILED (payment، not_applicable)؛ payment.collected_by هو مكلّف الإحضار أو المشرف المعتمد نفسه (13 §8.4؛ غيرهما ← VALIDATION_FAILED بـnot_eligible)؛ ويُقفل الحفل FOR SHARE بعد المجموعة حين تكون التذكرة due أو يُرسل payment (L1 ← L2 ← L4 ← L5 ← L6)؛ والبوابة check خطاف التحصيل المضمّن لكل حالة مالية (DEC-365)

        الأثر: كالتسليم + claim code revoked (exception_handover، ولو مقفلًا) + واقعة manual_verification (أو lost_ticket للورقية) تُنشأ دائمًا resolved بحل handover_exception: <methods> (auto_created: true) + العهدة من حائزيها الحاليين إلى العميل (DEC-210) + التحصيل المضمّن بـcollected_by من الجسم وpayment.recorded بـsource=exception (النقد بعهدة المحصّل حتى تسليمه، PAY-TC-22) + التدقيق handover.exception ثم payment.record بمعرّف طلب واحد (13 §8.4، DEC-365)
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
                identity_checks:
                  type: object
                  properties:
                    phone_last4:
                      type: string
                      pattern: ^[0-9]{4}$
                      description: يقارنه الخادم بآخر 4 أرقام المخزنة
                    plate_confirmed:
                      type: boolean
                    vehicle_description_confirmed:
                      type: boolean
                    document_note:
                      type: string
                      maxLength: 200
                      description: 'مثل: اطّلعت على الهوية الوطنية'
                  additionalProperties: false
                payment:
                  anyOf:
                  - $ref: '#/components/schemas/PaymentInputAttributed'
                  - type: 'null'
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
              required: [reason, identity_checks]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket:
                        $ref: '#/components/schemas/TicketDetail'
                      cycle:
                        $ref: '#/components/schemas/RetrievalCycle'
                      payment:
                        anyOf:
                        - $ref: '#/components/schemas/Payment'
                        - type: 'null'
                    required: [ticket, cycle]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: HANDOVER_NOT_READY | IDEMPOTENCY_IN_PROGRESS | PAYMENT_ALREADY_RECORDED | PAYMENT_PENDING | TICKET_CLOSED | VERSION_CONFLICT
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PAYMENT_AMOUNT_MISMATCH | PAYMENT_METHOD_NOT_ALLOWED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: handover.exception
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [HANDOVER_NOT_READY, PAYMENT_ALREADY_RECORDED, PAYMENT_AMOUNT_MISMATCH, PAYMENT_METHOD_NOT_ALLOWED, PAYMENT_PENDING, REASON_REQUIRED, TICKET_CLOSED, TICKET_NOT_FOUND, VALIDATION_FAILED, VERSION_CONFLICT]
      x-domain-events: [handover.exception_approved, handover.completed, ticket.delivered, task.completed, custody.changed, driver.availability_changed, task.promoted, incident.opened, incident.resolved, payment.recorded]
      x-ws-events: [ticket.updated, task.updated, driver.state_changed]
      x-whatsapp: [W-06]
  /v1/tasks/{taskId}/reassign:
    post:
      operationId: reassignTask
      summary: إعادة إسناد آمنة قبل بدء الحركة
      tags: [Retrieval & Handover]
      description: |-
        target_driver_id=null يعيد المهمة للطابور بأولويتها الأصلية؛ وإلا تُسند لسائق مؤهل في نفس المجموعة (accepted إن كان متاحًا، assigned_waiting إن كان مشغولًا بلا مهمة تالية). لا سحب خفي ولا إعادة إسناد بعد بدء الحركة.

        الشروط: task.status ∈ {queued, offered, broadcast, accepted, assigned_waiting} (الملف 10 §9.1)؛ in_progress ← REASSIGN_BLOCKED_MOVEMENT · queued/offered/broadcast: target_driver_id إلزامي وتُسحب الجولة الحية (close_reason=reassigned)؛ null لمهمة في الطابور ← INVALID_STATE_TRANSITION (already_in_queue)، والمكلّف نفسه ← (same_assignee) (DEC-214) · إذا استُلم المفتاح: /release-custody أولًا أو نقل عهدة رسمي للسائق الجديد

        الأثر: للطابور: task=queued + ticket=requested + تمريرة توزيع تستثني السائق السابق (DEC-216)؛ لسائق: كقبول ذري باسمه (accepted، أو assigned_waiting مع W-03 إن لم تُرسل في هذه الدورة) بـtask.reassigned (trigger=reassign، target=driver، from_status، result_status) وticket.assigned(_waiting) بـvia=supervisor، دون task.claimed (DEC-215)
      parameters:
      - $ref: '#/components/parameters/taskId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
                target_driver_id:
                  type: [string, 'null']
                  format: uuid
                override_priority:
                  type: boolean
                  description: مطلوب true لإسناد طلب أحدث بينما أقدم متاح لنفس المجموعة؛ يُدقق dispatch.priority_override
                  default: false
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
              required: [reason]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      task:
                        $ref: '#/components/schemas/Task'
                      ticket:
                        $ref: '#/components/schemas/TicketSummary'
                    required: [task, ticket]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: CUSTODY_RELEASE_REQUIRED | DRIVER_NOT_AVAILABLE | DUTY_REQUIRED | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | NEXT_TASK_ALREADY_RESERVED
            | OLDER_REQUEST_PENDING | REASSIGN_BLOCKED_MOVEMENT | VERSION_CONFLICT
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | REASON_REQUIRED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: task.reassign
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [CUSTODY_RELEASE_REQUIRED, DRIVER_NOT_AVAILABLE, DUTY_REQUIRED, INVALID_STATE_TRANSITION, NEXT_TASK_ALREADY_RESERVED, OLDER_REQUEST_PENDING,
        REASON_REQUIRED, REASSIGN_BLOCKED_MOVEMENT, VERSION_CONFLICT]
      x-domain-events: [task.withdrawn, task.reassigned, ticket.assigned, ticket.assigned_waiting, offer.revoked, task.offered, task.broadcast_opened, driver.availability_changed]
      x-ws-events: [task.updated, ticket.updated, driver.state_changed, offer.closed, task.offered, task.broadcast]
      x-whatsapp: [W-03]
