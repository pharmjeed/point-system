      x-error-codes: [CUSTODY_HOLDER_MISMATCH, HANDOVER_CODE_CONSUMED, HANDOVER_CODE_EXPIRED, HANDOVER_CODE_INVALID, HANDOVER_CODE_LOCKED, HANDOVER_NOT_READY, NOT_TASK_ASSIGNEE, PAPER_STUB_MISMATCH, PAYMENT_ALREADY_RECORDED, PAYMENT_AMOUNT_MISMATCH, PAYMENT_METHOD_NOT_ALLOWED, PAYMENT_PENDING, TICKET_CLOSED, TICKET_NOT_FOUND, VERSION_CONFLICT]
