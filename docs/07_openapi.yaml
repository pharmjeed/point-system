      operationId: voidTicket
      summary: إلغاء تذكرة بمشرف
      tags: [Intake & Tickets]
      description: |-
        للمسودات المهجورة أو الخاطئة قبل إتمام الصف. يقرّ المشرف بعودة المركبة والمفتاح للعميل قبل تحرير السائق. لتذاكر متوقفة خاطئة استخدم /manual-reconcile.

        الشروط: status ∈ {received, parking} (تذكرة نهائية ← INVALID_STATE_TRANSITION بـallowed_from [received, parking] لا TICKET_CLOSED) · لا دورة استرجاع مفتوحة · custody_returned_to_customer=true وإلا CUSTODY_OPEN (DEC-175)

        الأثر: voided + عهدة → customer (correction) + حل تنبيه draft_abandoned
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
