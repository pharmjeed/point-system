  /v1/customer/auth/reauth/verify:
    post:
      operationId: customerAuthReauthVerify
      summary: إعادة التحقق قبل حذف الحساب
      tags: [Customer]
      description: |-
        C-20 (V2-017، DEC-507): يطلب التطبيق رمزًا لرقم الحساب نفسه بـPOST /v1/customer/auth/otp (الحدود والقالب نفساهما)، ثم يرسله هنا بجلسته. القواعد كتحقق الدخول: رمز خاطئ يُنقص المحاولات (CUSTOMER_OTP_INVALID مع attempts_left)، والخامس يقفل الرقم 15 دقيقة (CUSTOMER_OTP_LOCKED)، والمنتهي أو المستعمل CUSTOMER_OTP_EXPIRED. النجاح يستهلك الرمز ويرد reauth_token مرتبطًا بهذه الجلسة وحدها، صالحًا 300 ث ولمرة واحدة، ولا يُخزَّن منه إلا sha256؛ والأحدث يحل محل السابق.

        الأثر: customer_otp_challenges + customer_account_sessions.reauth_hash + customer_audit_log (customer.auth.reauth_verified)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
              required: [code]
              additionalProperties: false
