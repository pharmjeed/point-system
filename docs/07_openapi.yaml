            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: سبب إلزامي يُحفظ في سجل التدقيق
              required: [reason]
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
