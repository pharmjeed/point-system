    get:
      operationId: getVenuePublicProfile
      summary: ملف الموقع العام (O-04)
      tags: [Venues & Setup]
      description: |-
        الإصدار الثاني (V2-004، DEC-490): ملف الموقع على خريطة تطبيق العميل كما يراه المشغل في S-13 — التصنيف والعنوان والمدينة (من venues) والإحداثيات والساعات الأسبوعية والصور بروابط موقّعة قصيرة (≤ 300 ث)، والحالة (draft/submitted/approved/hidden) وملاحظة المراجع عند الإرجاع أو الإخفاء، والاشتراك وسعر الزيارة اللذان تحددهما المنصة (قراءة).

        موقع بلا ملف ← status: null وversion: 0. موقع من مؤسسة أخرى أو غير موجود ← RESOURCE_NOT_FOUND بالرد نفسه.
