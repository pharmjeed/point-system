  /v1/tickets:
    post:
      operationId: startIntake
      summary: 'استلام مركبة: بدء التسجيل'
      tags: [Intake & Tickets]
      description: |-
        المشغل معلّق أو منتهٍ من المنصة ← 409 OPERATOR_SUSPENDED (V2-005، DEC-486)

        يضغط السائق «استلام مركبة» فيُنشأ في معاملة واحدة: تذكرة received برقم ظاهر من events.next_display_number + مهمة park بحالة in_progress باسمه + عهدة المركبة والمفتاح للسائق. يتنافس ذريًا مع قبول العروض (قفل مجموعة التوزيع).

        الشروط: مناوبة on_duty (وإلا DUTY_REQUIRED) · ليس في استراحة (DRIVER_ON_BREAK) · لا مهمة حركة نشطة accepted/in_progress بما فيها مهمة تالية رُقّيت (MOVEMENT_IN_PROGRESS) · حفل open في الموقع؛ event_id إلزامي إذا أكثر من حفل مفتوح (DEC-37)

        الأثر: tickets(received) + لقطة الرسوم: fee_halalas من الحفل وpayment_status=due لـper_vehicle وإلا not_required (DEC-43) + tasks(park,in_progress) + custody_events(intake ×2) + ticket_events + audit_log
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: [string, 'null']
                  format: uuid
                channel:
                  type: string
                  enum: [whatsapp, paper]
                  description: app لا يُطلب هنا؛ يأتي من POST /v1/tickets/intake-pass (DEC-501)
              additionalProperties: false
            examples:
              single_event:
                summary: حفل واحد مفتوح
                value:
                  channel: whatsapp
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ticket:
                        $ref: '#/components/schemas/TicketDetail'
                      task:
                        $ref: '#/components/schemas/Task'
                      driver_state:
                        $ref: '#/components/schemas/DriverState'
                    required: [ticket, task, driver_state]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '409':
          $ref: '#/components/responses/Error'
          description: DRIVER_ON_BREAK | DUTY_REQUIRED | EVENT_NOT_OPEN | IDEMPOTENCY_IN_PROGRESS | MOVEMENT_IN_PROGRESS | OPERATOR_SUSPENDED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.intake
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [DRIVER_ON_BREAK, DUTY_REQUIRED, EVENT_NOT_OPEN, MOVEMENT_IN_PROGRESS, OPERATOR_SUSPENDED]
      x-domain-events: [ticket.created, task.created, custody.changed, driver.availability_changed]
      x-ws-events: [driver.state_changed, ticket.updated]
    get:
      operationId: listTickets
      summary: قائمة/بحث المركبات
      tags: [Intake & Tickets]
      description: 'السائق: تذاكر موقعه المفتوحة فقط وبالإسقاط الأدنى. البحث q يطابق أرقام اللوحة أو الرقم الظاهر. الترتيب: الأحدث إنشاءً أولًا. المرشحات تُقاطع مع
        نطاق المستدعي: event_id خارج النطاق يعيد قائمة فارغة (لا كشف)، وvenue_id خارج النطاق يعيد SCOPE_VENUE_DENIED.'
      parameters:
      - name: event_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: venue_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TicketStatus'
        description: قيم متعددة مفصولة بفاصلة
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 20
        description: 'أرقام اللوحة (احتواء في أي موضع) أو رقم التذكرة (تطابق تام)، بعد حذف ما ليس رقمًا وتوحيد الأرقام العربية الهندية؛ q بلا أرقام يعيد قائمة فارغة (DEC-388)'
      - name: open_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: مؤشر معتم من meta.next_cursor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummaryPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: PAGINATION_CURSOR_INVALID
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED | SCOPE_VENUE_DENIED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      x-permission: ticket.read_minimal
      x-idempotency: none
      x-rate-limit-class: read
      x-error-codes: [SCOPE_VENUE_DENIED]
  /v1/tickets/intake-pass:
    post:
      operationId: intakeByPass
      summary: 'استلام بمسح بطاقة الدخول من تطبيق العميل (O-01)'
      tags: [Intake & Tickets]
      description: |-
        الإصدار الثاني (V2-013، V2-014؛ DEC-500، DEC-501، DEC-502). يمسح السائق في D-05 رمز QR المتغير من شاشة C-11 في تطبيق العميل؛ صيغة الرمز P1.<account>.<vehicle>.<step>.<mac> (docs/v2/05 §1.3).

        ticket_id + expected_version: مسودة السائق نفسه (received، أنشأها هو في مناوبته) تصبح تذكرة تطبيق — الطريق الذي يستعمله D-05 لأن «استلام مركبة» في D-04 أنشأ المسودة. بلا ticket_id: تُنشأ التذكرة كما في POST /v1/tickets (event_id بالقاعدة نفسها) ثم تُربط، والرد 201 بالمهمة وحالة السائق.

        الشروط: نطاق POST /v1/tickets نفسه (مناوبة في الموقع، ليس في استراحة، المشغل غير معلّق ← OPERATOR_SUSPENDED حتى للمسودة القائمة) · المسودة بلا قناة عميل (لا جوال ولا رقم ورقي ولا رمز ربط ولا تذكرة تطبيق) وإلا INVALID_STATE_TRANSITION (reason: customer_channel_set) · الرمز بصيغته وتوقيعه بسر الحساب لحساب active (PASS_INVALID) · الخطوة ضمن الحالية ± 1 على ساعة الخادم وأكبر من آخر خطوة استُعملت (PASS_EXPIRED).

        الأثر: channel = app، wa_link_status = none، صف customers للمشغل مربوط بالحساب (customer_account_id؛ الجوال واللغة فقط، V2-D12)، customer_vehicle_id وحقول السيارة منسوخة من customer_vehicles إن كانت السيارة المختارة في الحساب (وإلا تبقى للسائق يدويًا، vehicle_prefilled: false)، entitlement كما حُدد عند إنشاء التذكرة (event_included لحفل included وإلا none)، customer_passes.last_used_step، audit_log. لا W-01 ولا أي رسالة واتساب لهذه التذكرة (DEC-503).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pass_token:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: نص رمز QR كما قرأته الكاميرا
                ticket_id:
                  type: string
                  format: uuid
                  description: مسودة السائق في D-05
                expected_version:
                  type: integer
                  minimum: 1
                  description: إلزامي مع ticket_id
                event_id:
                  type: [string, 'null']
                  format: uuid
                  description: بلا ticket_id فقط، كما في POST /v1/tickets
              required: [pass_token]
              additionalProperties: false
            examples:
              d05_draft:
                summary: مسودة D-05
                value:
                  pass_token: P1.AAAAAAAAQACAAAAAAAAAAQ.AAAAAAAAQACAAAAAAAAAAg.59434512.pQ1w9xZr5vA3nK
                  ticket_id: 5d1c7a40-9b8e-4f2a-a3c1-0e2d4f6a8b10
                  expected_version: 1
      responses:
        '200':
          description: المسودة صارت تذكرة تطبيق
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakePassResultEnvelope'
        '201':
          description: تذكرة جديدة بالبطاقة (بلا ticket_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakePassResultEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: ASSIGNMENT_REQUIRED | AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND | TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: DRIVER_ON_BREAK | DUTY_REQUIRED | EVENT_NOT_OPEN | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | MOVEMENT_IN_PROGRESS | OPERATOR_SUSPENDED | VERSION_CONFLICT
        '410':
          $ref: '#/components/responses/Error'
          description: PASS_EXPIRED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PASS_INVALID | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.intake
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [DRIVER_ON_BREAK, DUTY_REQUIRED, EVENT_NOT_OPEN, INVALID_STATE_TRANSITION, MOVEMENT_IN_PROGRESS, OPERATOR_SUSPENDED, PASS_EXPIRED, PASS_INVALID, TICKET_NOT_FOUND, VERSION_CONFLICT]
      x-domain-events: [ticket.created, task.created, custody.changed, driver.availability_changed]
      x-ws-events: [driver.state_changed, ticket.updated]
  /v1/tickets/{ticketId}/intake:
    patch:
      operationId: patchIntake
      summary: تعبئة بيانات الاستلام (مسودة)
      tags: [Intake & Tickets]
      description: |-
        تحديث جزئي لا يفقد المدخلات؛ يمكن استدعاؤه عدة مرات. expected_version إلزامي. الحفل ورقم التذكرة يُحددان عند البدء ولا يتغيران؛ الحفل الخاطئ يُعالج بتجاهل المسودة أو إلغائها ثم البدء من جديد. استثناء DEC-40: أثناء parking يقبل فقط {channel: paper, paper_serial} لتحويل تذكرة واتساب غير مربوطة إلى ورقية (wa_link_status=none، link_version+1، إبطال رمز الربط الحي بسبب channel_paper).

        الشروط: status=received (كل الحقول)، أو status=parking مع channel=paper وpaper_serial فقط وwa_link_status≠linked (DEC-40)؛ غير ذلك INVALID_STATE_TRANSITION · المستدعي منشئ التذكرة وأثناء مناوبته

        الأثر: يحدّث حقول المسودة؛ لا رسائل للعميل. تحويل الورقي (DEC-40): channel=paper + wa_link_status=none + link_version+1 + ticket.wa_link_changed

        الاتصال الفوري: ticket.updated لتحويل DEC-40 وحده؛ تعديل المسودة لا يصدر حدثًا نطاقيًا ولا ticket.updated، وتتابع S-02 المسودات بـticket.created وticket.intake_submitted (DEC-274)
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                  description: رقم الإصدار للتزامن المتفائل
                channel:
                  type: string
                  enum: [whatsapp, paper]
                  description: 'تذكرة app تتحول إلى واتساب أو ورقية في received فقط (تفك ربط الحساب، DEC-501)'
                plate:
                  $ref: '#/components/schemas/PlateInput'
                vehicle:
                  $ref: '#/components/schemas/VehicleInfo'
                customer_phone:
                  type: [string, 'null']
                  description: أي صيغة سعودية؛ يُطبّع E.164
                consent:
                  anyOf:
                  - $ref: '#/components/schemas/ConsentInput'
                  - type: 'null'
                paper_serial:
                  type: [string, 'null']
                  maxLength: 20
                key_tag:
                  type: [string, 'null']
                  maxLength: 20
                notes:
                  type: [string, 'null']
                  maxLength: 500
                damage_marks:
                  type: array
                  items:
                    $ref: '#/components/schemas/DamageMark'
                  maxItems: 20
              required: [expected_version]
              additionalProperties: false
            examples:
              step1:
                summary: 'الخطوة 1: المركبة والعميل'
                value:
                  expected_version: 1
                  plate:
                    country: SA
                    digits: '1234'
                    letters_ar: ب ح د
                  vehicle:
                    make: toyota
                    model: كامري
                    color: white
                    type: sedan
                  customer_phone: '0551234567'
                  consent:
                    method: verbal_staff_confirmed
                    confirmed: true
              step2:
                summary: 'الخطوة 2: المفتاح'
                value:
                  expected_version: 2
                  key_tag: K-73
              switch_to_paper:
                summary: تحويل إلى ورقية أثناء parking (DEC-40)
                value:
                  expected_version: 4
                  channel: paper
                  paper_serial: '004521'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetailEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: DUTY_REQUIRED | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | KEY_TAG_IN_USE | PAPER_SERIAL_IN_USE | VERSION_CONFLICT
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PHONE_INVALID | PLATE_INVALID | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: ticket.intake
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [DUTY_REQUIRED, INVALID_STATE_TRANSITION, KEY_TAG_IN_USE, PAPER_SERIAL_IN_USE, PHONE_INVALID, PLATE_INVALID, TICKET_NOT_FOUND, VERSION_CONFLICT]
      x-domain-events: [ticket.wa_link_changed]
      x-ws-events: [ticket.updated]
