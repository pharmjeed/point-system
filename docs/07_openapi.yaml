      type: string
      enum: [draft, submitted, approved, hidden]
      description: venue_public_profiles.status (V2-004)
    VenueCategory:
      type: string
      enum: [hall, office, mall, hospital, residential, hotel, club, other]
    OpeningInterval:
      type: object
      properties:
        open:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
        close:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$
          description: أبكر من open = يمتد بعد منتصف الليل إلى اليوم التالي؛ 24:00 = منتصف الليل
      required: [open, close]
      additionalProperties: false
    OpeningHours:
      type: object
      description: ساعات العمل الأسبوعية بتوقيت الرياض (شكل DEC-482)؛ اليوم الغائب أو الفارغ مغلق، والفترات في اليوم لا تتداخل (DEC-490)
      properties:
        always_open:
          type: boolean
        days:
          type: object
          properties:
            sun: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
            mon: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
            tue: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
            wed: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
            thu: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
            fri: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
            sat: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/OpeningInterval'}}
          additionalProperties: false
      required: [always_open, days]
      additionalProperties: false
    ProfilePhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: رابط GET موقّع قصير للمخزن الخاص (≤ 300 ث)، لا رابط عام أبدًا
        expires_at:
          type: string
          format: date-time
      required: [id, url, expires_at]
    VenuePublicProfile:
      type: object
      properties:
        venue_id:
          type: string
          format: uuid
        venue:
          type: object
          properties:
            code: {type: string}
            name_ar: {type: string}
            name_en: {type: [string, 'null']}
            status: {type: string, enum: [active, inactive]}
          required: [code, name_ar, name_en, status]
        status:
          oneOf:
          - $ref: '#/components/schemas/VenuePublicStatus'
          - type: 'null'
          description: null = لا ملف بعد
        category:
          oneOf:
          - $ref: '#/components/schemas/VenueCategory'
          - type: 'null'
        address: {type: [string, 'null']}
        city: {type: [string, 'null']}
        lat: {type: [number, 'null']}
        lng: {type: [number, 'null']}
        opening_hours:
          $ref: '#/components/schemas/OpeningHours'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ProfilePhoto'
        subscriptions_enabled: {type: boolean}
        pay_per_visit_halalas: {type: [integer, 'null']}
        approved_at: {type: [string, 'null'], format: date-time}
        review_note:
          type: [object, 'null']
          description: سبب آخر إرجاع (والملف مسودة لم يُعد إرسالها) أو إخفاء (والملف مخفي)
          properties:
            kind: {type: string, enum: [sent_back, hidden]}
            reason: {type: string}
            at: {type: string, format: date-time}
          required: [kind, reason, at]
        version:
          type: integer
          minimum: 0
          description: 0 = لا ملف بعد
        updated_at: {type: [string, 'null'], format: date-time}
      required: [venue_id, venue, status, category, address, city, lat, lng, opening_hours, photos, subscriptions_enabled, pay_per_visit_halalas, approved_at, review_note, version, updated_at]
