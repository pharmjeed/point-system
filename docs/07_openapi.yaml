                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION
        '413':
          $ref: '#/components/responses/Error'
          description: MEDIA_TOO_LARGE
        '415':
          $ref: '#/components/responses/Error'
          description: MEDIA_TYPE_UNSUPPORTED
        '422':
          $ref: '#/components/responses/Error'
