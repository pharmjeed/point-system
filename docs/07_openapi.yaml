      allOf:
      - $ref: '#/components/schemas/VenuePublicProfile'
      - type: object
        properties:
          org:
            type: object
            properties:
              id: {type: string, format: uuid}
              name_ar: {type: string}
              name_en: {type: [string, 'null']}
              operator_status: {type: string, enum: [invited, trial, active, suspended, terminated]}
            required: [id, name_ar, name_en, operator_status]
          approved_by: {type: [string, 'null'], format: uuid}
        required: [org, approved_by]
    PlatformVenueListItem:
      type: object
      properties:
        venue_id: {type: string, format: uuid}
        venue:
          type: object
          properties:
            code: {type: string}
