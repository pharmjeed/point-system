  /v1/tickets/{ticketId}/whatsapp-link:
    post:
      operationId: linkWhatsApp
      summary: 'ربط واتساب: إرسال مباشر أو إصدار QR'
      tags: [Intake & Tickets]
      description: |-
        direct: يرسل W-01 من رقم مصاف إلى جوال التذكرة (يتطلب موافقة سارية)؛ يُستخدم آليًا عند submit-intake ويدويًا لإعادة المحاولة. qr: يصدر link_code صالح link.qr_ttl_min ويعيد رابط wa.me برسالة معبأة؛ العميل يضغط إرسال ثم يؤكد السائق المطابقة.

        الشروط: تذكرة مفتوحة في موقع السائق ومناوبته فيه · الورقية ← INVALID_STATE_TRANSITION (paper_channel) · قناة فعالة غير down وإلا WA_CHANNEL_UNAVAILABLE (DEC-195) · direct (إعادة المحاولة من D-07، DEC-193): wa_link_status ∈ {none, failed, pending_send}؛ received ← INVALID_STATE_TRANSITION (submit_intake_links_directly)، linked (already_linked)، رسالة QR بانتظار التأكيد (qr_pending_confirmation)؛ بلا جوال ← PHONE_INVALID {field: customer_phone, issue: missing} (DEC-194) · qr: status ∈ {received, parking, parked} وwa_link_status ∈ {none, failed, opted_out, pending_send}؛ بلا رقم عرض ← WA_CHANNEL_UNAVAILABLE (reason=display_phone_not_configured) (DEC-196)

        الأثر: direct: wa_link_status=pending_send ثم linked عند قبول المزود أو failed؛ link_version+1 إن وُجد إشعار W-01 للإصدار الحالي (DEC-193). qr: link_codes(active) + job.link_code_expire، بلا تغيير في التذكرة ولا إصدارها ولا حدث نطاقي (DEC-196)
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [direct, qr]
              required: [method]
              additionalProperties: false
            examples:
              direct:
                summary: إعادة الإرسال المباشر
                value:
                  method: direct
              qr:
                summary: إصدار QR
                value:
                  method: qr
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaLinkResultEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: TICKET_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: DUTY_REQUIRED | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION | TICKET_CLOSED | WA_CONSENT_MISSING | WA_CUSTOMER_OPTED_OUT | WA_TEMPLATE_NOT_APPROVED
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | PHONE_INVALID | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE | WA_CHANNEL_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: wa.link
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [DUTY_REQUIRED, INVALID_STATE_TRANSITION, PHONE_INVALID, TICKET_CLOSED, TICKET_NOT_FOUND, WA_CHANNEL_UNAVAILABLE, WA_CONSENT_MISSING, WA_CUSTOMER_OPTED_OUT,
        WA_TEMPLATE_NOT_APPROVED]
      x-domain-events: [ticket.wa_link_changed]
      x-ws-events: [ticket.updated]
      x-whatsapp: [W-01]
  /v1/tickets/{ticketId}/whatsapp-link/confirm:
    post:
      operationId: confirmWhatsAppLink
      summary: تأكيد مطابقة مرسل QR للمركبة
      tags: [Intake & Tickets]
      description: |-
        بعد وصول رسالة الربط يرى السائق الرقم المقنّع ويسأل «هل هذا العميل أمامك؟». matches=false يرفض الربط ويُبطل الرمز.

        الشروط: link_codes.status=pending_confirmation لنفس التذكرة (وإلا INVALID_STATE_TRANSITION؛ رمز ليس للتذكرة ← RESOURCE_NOT_FOUND بـresource=link_code؛ المنتهي ← WA_LINK_CODE_EXPIRED بـexpired_at) · السائق منشئ الرمز (وإلا PERMISSION_DENIED بـreason=not_link_code_creator) أو مشرف الموقع؛ لا فحص مناوبة (DEC-198)

        الأثر: matches=true: موافقة customer_initiated (captured_by = المؤكِّد) + ticket.customer_id + linked + W-01؛ مرسل غير العميل الحالي: إبطال موافقات السابق للتذكرة ورموز الإجراء وlink_version+1 (DEC-199). false: revoked (driver_rejected_match) وwa_link_status=none (DEC-200)
