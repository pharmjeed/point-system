  /v1/customer/auth/verify:
    post:
      operationId: customerAuthVerify
      summary: التحقق من الرمز وفتح الجلسة
      tags: [Customer]
      description: |-
        C-03. الخطأ CUSTOMER_OTP_INVALID مع attempts_left، والخامس يقفل الرقم 15 دقيقة CUSTOMER_OTP_LOCKED مع locked_until (يرفض الطلب والتحقق معًا)، والمنتهي أو المستعمل CUSTOMER_OTP_EXPIRED. أول نجاح ينشئ الحساب (is_new_account).

        الأثر: customer_accounts (أول مرة) + customer_account_sessions (sha256 للرمزين فقط؛ جلسة الجهاز السابقة تُلغى) + customer_audit_log؛ لا كوكي
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_e164:
                  type: string
                  pattern: '^\+9665[0-9]{8}$'
                  description: جوال سعودي فقط
                  examples: ['+966512345678']
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                device_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: معرّف عشوائي ينشئه التطبيق مرة لكل تثبيت (حد المعدل لكل جهاز)
                platform:
                  type: string
                  enum: [ios, android]
              required: [phone_e164, code, device_id, platform]
              additionalProperties: false
