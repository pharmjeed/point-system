  /v1/task-offers/{offerId}/accept:
    post:
      operationId: acceptOffer
      summary: قبول الطلب أو حجزه كمهمة تالية
      tags: [Retrieval & Handover]
      description: |-
        معاملة ذرية بترتيب أقفال Canon §14ب: المجموعة L1 ← المهمة L4 ← التذكرة L5 ← الدورة L6 ← الجولة L7 ← مناوبة القابل L8 (الملف 10 §5.2، وترتيب الفحوص فيه ملزم). أول قبول يؤكده الخادم يفوز. السائق المتاح → accepted؛ المشغول بلا مهمة تالية → assigned_waiting. لا يُقبل طلب أحدث بينما أقدم متاح لنفس المجموعة. يُقبل طلب وصل قبل expires_at + dispatch.accept_grace_ms (إعداد الموقع، الافتراضي 1500) ما دامت الجولة لم تُغلق لصالح غيره. إن كان للقابل عرض فردي حي آخر يُسحب (recipient_unavailable) وتعود مهمته للطابور قبل التمريرة. عرض في موقع خارج نطاق المستدعي ← 404 OFFER_NOT_FOUND.

        الشروط: العرض active والمستدعي من مستلميه · مناوبة on_duty · أقدم طلب متاح · مهمة تالية واحدة كحد أقصى

        الأثر: accepted: ticket=assigned؛ assigned_waiting: ticket=assigned_waiting + W-03؛ إبطال بقية جولات/مستلمي العرض
      parameters:
      - $ref: '#/components/parameters/offerId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      result:
                        type: string
                        enum: [accepted, assigned_waiting]
                        description: قيمتان من TaskStatus
                      task:
                        $ref: '#/components/schemas/Task'
                      ticket:
                        $ref: '#/components/schemas/TicketSummary'
                      driver_state:
                        $ref: '#/components/schemas/DriverState'
                    required: [result, task, ticket, driver_state]
                  meta:
                    $ref: '#/components/schemas/Meta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: ASSIGNMENT_REQUIRED | AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | NOT_OFFER_RECIPIENT | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: OFFER_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: DRIVER_NOT_AVAILABLE | DRIVER_ON_BREAK | DUTY_REQUIRED | IDEMPOTENCY_IN_PROGRESS | NEXT_TASK_ALREADY_RESERVED | OLDER_REQUEST_PENDING | TASK_ALREADY_CLAIMED
        '410':
          $ref: '#/components/responses/Error'
          description: OFFER_EXPIRED | OFFER_REVOKED
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: offer.accept
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [ASSIGNMENT_REQUIRED, DRIVER_NOT_AVAILABLE, DRIVER_ON_BREAK, DUTY_REQUIRED, NEXT_TASK_ALREADY_RESERVED, NOT_OFFER_RECIPIENT, OFFER_EXPIRED, OFFER_NOT_FOUND,
        OFFER_REVOKED, OLDER_REQUEST_PENDING, TASK_ALREADY_CLAIMED]
      x-domain-events: [task.claimed, ticket.assigned, ticket.assigned_waiting, driver.availability_changed, offer.revoked]
      x-ws-events: [task.claimed, task.updated, ticket.updated, driver.state_changed]
      x-whatsapp: [W-03]
