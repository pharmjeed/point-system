        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: [string, 'null']
                  format: uuid
                client_session_id:
                  type: [string, 'null']
                  description: معرّف جلسة العميل في المتصفح (الملف 15 §8)
                  maxLength: 64
                app_version:
                  type: string
                  maxLength: 32
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/TelemetryEvent'
                  minItems: 1
                  maxItems: 50
              required: [app_version, events]
              additionalProperties: false
