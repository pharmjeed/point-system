      description: auth_sessions.revoked_reason
    ConsentMethod:
      type: string
      enum: [verbal_staff_confirmed, customer_initiated]
      description: customer_consents.method
    ErrorCode:
      type: string
      enum: [ASSIGNMENT_CONFLICT, ASSIGNMENT_REQUIRED, AUTH_ACCOUNT_DISABLED, AUTH_ACCOUNT_LOCKED, AUTH_INVALID_CREDENTIALS, AUTH_MFA_INVALID, AUTH_MFA_REQUIRED,
        AUTH_MFA_SETUP_REQUIRED, AUTH_SECRET_CHANGE_REQUIRED, AUTH_SESSION_EXPIRED, AUTH_SESSION_REVOKED, AUTH_UNAUTHENTICATED, CONSENT_REQUIRED, CUSTODY_HOLDER_MISMATCH,
        CUSTODY_OPEN, CUSTODY_RELEASE_REQUIRED, DEPENDENCY_TIMEOUT, DRAFT_HAS_DATA, DRIVER_DISABLED, DRIVER_NOT_AVAILABLE, DRIVER_ON_BREAK, DUTY_ALREADY_STARTED,
        DUTY_END_BLOCKED_CUSTODY, DUTY_REQUIRED, EVENT_ALREADY_CLOSED, EVENT_CLOSE_BLOCKED, EVENT_NOT_OPEN, HANDOVER_CODE_CONSUMED, HANDOVER_CODE_EXPIRED, HANDOVER_CODE_INVALID,
        HANDOVER_CODE_LOCKED, HANDOVER_NOT_READY, IDEMPOTENCY_IN_PROGRESS, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, INSPECTION_INCOMPLETE, INTAKE_INCOMPLETE,
        INTERNAL_ERROR, INVALID_STATE_TRANSITION, KEY_NOT_PICKED_UP, KEY_SLOT_OCCUPIED, KEY_TAG_IN_USE, MEDIA_TOO_LARGE, MEDIA_TYPE_UNSUPPORTED, MEDIA_UPLOAD_INCOMPLETE,
        MOVEMENT_IN_PROGRESS, NEXT_TASK_ALREADY_RESERVED, NOT_OFFER_RECIPIENT, NOT_TASK_ASSIGNEE, OFFER_EXPIRED, OFFER_NOT_FOUND, OFFER_REVOKED, OLDER_REQUEST_PENDING,
        OPERATOR_SUSPENDED,
        PAGINATION_CURSOR_INVALID, PAPER_SERIAL_IN_USE, PAPER_STUB_MISMATCH, PARKING_SPOT_OCCUPIED, PASS_EXPIRED, PASS_INVALID, PAYLOAD_TOO_LARGE, PAYMENT_ALREADY_RECORDED, PAYMENT_ALREADY_REVERSED,
        PAYMENT_AMOUNT_MISMATCH, PAYMENT_FAILED, PAYMENT_METHOD_NOT_ALLOWED, PAYMENT_NOT_REFUNDABLE, PAYMENT_PENDING,
        PAYMENT_WEBHOOK_SIGNATURE_INVALID, PERMISSION_DENIED, PHONE_INVALID, PLATE_INVALID, PLATFORM_AUTH_REQUIRED, RATE_LIMITED, REASON_REQUIRED, REASSIGN_BLOCKED_MOVEMENT, REFUND_AMOUNT_EXCEEDS_PAID,
        RESEND_LIMIT_REACHED, RESOURCE_NOT_FOUND, RETRIEVAL_ALREADY_ACTIVE, SCOPE_VENUE_DENIED, SERVICE_UNAVAILABLE, SHIFT_ALREADY_OPEN, SHIFT_CLOSE_BLOCKED, SHIFT_NOT_OPEN,
        TASK_ALREADY_CLAIMED, TASK_NOT_STARTABLE, TICKET_CLOSED, TICKET_NOT_FOUND, TICKET_NOT_PARKED, TRANSFER_ALREADY_PENDING, TRANSFER_BLOCKED_CUSTODY, TRANSFER_SCOPE_DENIED,
        VALIDATION_FAILED, VERSION_CONFLICT, WA_CHANNEL_UNAVAILABLE, WA_CONSENT_MISSING, WA_CUSTOMER_OPTED_OUT, WA_LINK_CODE_EXPIRED, WA_NOT_LINKED, WA_SEND_FAILED,
        WA_TEMPLATE_NOT_APPROVED, WA_WEBHOOK_SIGNATURE_INVALID, WA_WEBHOOK_VERIFY_FAILED]
      description: رموز الأخطاء الموحدة (canon §8)
    Meta:
      type: object
      properties:
        request_id:
          type: string
          description: معرّف الطلب؛ يطابق ترويسة X-Request-Id
          examples: [req_01JBX4T1Q8]
        server_time:
          type: string
          format: date-time
        replayed:
          type: boolean
          description: true عند إعادة رد محفوظ لنفس Idempotency-Key
      required: [request_id, server_time]
    PageMeta:
      type: object
      properties:
        request_id:
          type: string
        server_time:
          type: string
          format: date-time
        next_cursor:
          type: [string, 'null']
          description: مؤشر الصفحة التالية؛ null عند النهاية
      required: [request_id, server_time, next_cursor]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: رسالة إنجليزية مختصرة للمطور
            message_ar:
              type: string
              description: نص عربي جاهز للعرض للمستخدم
            request_id:
              type: string
            retryable:
              type: boolean
              description: هل يجوز إعادة المحاولة بنفس Idempotency-Key
            details:
              type: object
              properties: {}
              description: تفاصيل خاصة بالرمز (fields, missing, attempts_left, older_task_id, current_version, items ...)
              additionalProperties: true
          required: [code, message, message_ar, request_id, retryable]
      required: [error]
    FieldError:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
        message_ar:
          type: string
      required: [field, issue]
    UserRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_code:
          type: string
      required: [id, full_name]
    Plate:
      type: object
      properties:
        country:
          type: string
          description: رمز الدولة، الافتراضي SA
          default: SA
        digits:
          type: [string, 'null']
          description: حتى 4 أرقام لاتينية
          pattern: ^[0-9]{1,4}$
        letters_ar:
          type: [string, 'null']
          description: 3 أحرف عربية من أحرف اللوحات السعودية مفصولة بمسافة
          examples: [ب ح د]
        letters_en:
          type: [string, 'null']
          description: المقابل اللاتيني
          examples: [B J D]
        raw:
          type: [string, 'null']
          description: للوحات غير السعودية أو الحرة
        display:
          type: string
          description: نص العرض المحسوب
          examples: [1234 ب ح د]
      required: [country, display]
    PlateInput:
      type: object
      properties:
        country:
          type: string
          default: SA
        digits:
          type: string
          pattern: ^[0-9]{1,4}$
        letters_ar:
          type: string
          description: '3 أحرف من: ا ب ح د ر س ص ط ع ق ك ل م ن ه و ى'
        letters_en:
          type: string
          description: اختياري؛ يُشتق من letters_ar إن لم يُرسل
        raw:
          type: string
          description: إلزامي عندما country != SA
      description: 'SA: digits + letters_ar إلزاميان؛ غير ذلك raw. اللوحة غير السعودية مجهولة الدولة: country = XX (رمز ISO المخصص للمستخدم) مع raw (DEC-349). الخطأ PLATE_INVALID'
      additionalProperties: false
    VehicleInfo:
      type: object
      properties:
        make:
          type: [string, 'null']
          examples: [toyota]
          description: مفتاح 02 §8.4 (مثل toyota)، أو النص المكتوب لـ«أخرى» (DEC-350)
        model:
          type: [string, 'null']
          examples: [كامري]
        color:
          type: [string, 'null']
          examples: [white]
          description: مفتاح 02 §8.4 (مثل white)، أو النص المكتوب لـ«أخرى» (DEC-350)
        type:
          anyOf:
          - $ref: '#/components/schemas/VehicleType'
          - type: 'null'
    DamageMark:
      type: object
      properties:
        area:
          type: string
          examples: [front_left]
        note:
          type: string
          examples: [خدش خفيف]
      required: [area]
    ConsentInput:
      type: object
      properties:
        method:
          type: string
          enum: [verbal_staff_confirmed]
          description: الموافقة الشفهية التي يؤكدها السائق؛ customer_initiated يضعها الخادم فقط في ربط QR
        confirmed:
          type: boolean
          const: true
      required: [method, confirmed]
      additionalProperties: false
    PaymentInput:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount_halalas:
          type: integer
          format: int64
          minimum: 0
          description: يجب أن يساوي tickets.fee_halalas
        pos_reference:
          type: [string, 'null']
          description: رقم إيصال الجهاز فقط؛ يُرفض ما يشبه رقم بطاقة
          maxLength: 40
      required: [method, amount_halalas]
      additionalProperties: false
    PaymentInputAttributed:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount_halalas:
          type: integer
          format: int64
          minimum: 0
          description: يجب أن يساوي tickets.fee_halalas
        pos_reference:
          type: [string, 'null']
          description: رقم إيصال الجهاز فقط؛ يُرفض ما يشبه رقم بطاقة
          maxLength: 40
        collected_by:
          type: string
          format: uuid
          description: الموظف الذي حصّل فعلًا وبعهدته النقد — في التسليم الاستثنائي مكلّف الإحضار أو المشرف المعتمد نفسه (13 §8.4، وإلا VALIDATION_FAILED بـnot_eligible)، وفي المطابقة اليدوية من في السجل الورقي
      required: [method, amount_halalas, collected_by]
      description: تحصيل منسوب لمحصّل محدد (التسليم الاستثنائي والمطابقة اليدوية) — الملف 13
      additionalProperties: false
    OrgSettings:
      type: object
      properties:
        security:
          type: object
          properties:
            supervisor_mfa_required:
              type: boolean
              default: true
            driver_session_hours:
              type: integer
              minimum: 1
              default: 14
            staff_session_hours:
              type: integer
              minimum: 1
              default: 12
            max_login_attempts:
              type: integer
              minimum: 3
              default: 5
            admin_idle_minutes:
              type: integer
              minimum: 5
              default: 30
            reveal_phone_per_hour:
              type: integer
              minimum: 1
              default: 20
          required: [supervisor_mfa_required, driver_session_hours, staff_session_hours, max_login_attempts, admin_idle_minutes, reveal_phone_per_hour]
          description: security.pin_length ثابت (6) وليس مفتاحًا هنا (DEC-09)؛ أي مفتاح إضافي ← VALIDATION_FAILED
          additionalProperties: false
        heartbeat:
          type: object
          properties:
            interval_s:
              type: integer
              minimum: 5
              default: 15
            uncertain_after_s:
              type: integer
              minimum: 10
              default: 45
            offline_after_s:
              type: integer
              minimum: 30
              default: 120
          required: [interval_s, uncertain_after_s, offline_after_s]
          description: 'شرط ترتيب: interval_s < uncertain_after_s < offline_after_s، وإلا VALIDATION_FAILED'
          additionalProperties: false
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [security, heartbeat]
      description: organizations.settings.security.* و heartbeat.* (Canon §12، DEC-39). للمالك فقط؛ security.* يسري على الجلسات الجديدة، و heartbeat.* يُدفع للأجهزة
        عبر sync.required
    RoleScope:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scope_type:
          $ref: '#/components/schemas/ScopeType'
        venue_id:
          type: [string, 'null']
          format: uuid
        granted_at:
          type: string
          format: date-time
      required: [id, scope_type, venue_id]
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
