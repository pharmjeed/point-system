      summary: حذف الحساب C-20
      tags: [Customer]
      description: |-
        متطلب Apple وGoogle (V2-017، DEC-507، DEC-508). يلزمه دليل تحقق حديث من POST /v1/customer/auth/reauth/verify لهذه الجلسة نفسها (صالح 300 ث، مرة واحدة)، وإلا CUSTOMER_REAUTH_REQUIRED بـreason (missing / invalid / expired). يُرفض أثناء زيارة جارية (CUSTOMER_ACCOUNT_VISIT_ACTIVE). في معاملة واحدة: status = deleted وdeleted_at، يُمحى الاسم ويُستبدل الجوال ببصمة HMAC لا تُعكس (phone_hash) فيسجّل الرقم نفسه حسابًا جديدًا لاحقًا، تُزال السيارات (removed_at)، تُلغى الجلسات (account_closed) وتُسقط رموز الإشعارات، ويُغلق رمز دخول مفتوح للرقم. تبقى سجلات التدقيق والموافقات، وصفوف customers لدى المشغلين وتذاكرهم بحسب احتفاظ كل مشغل (V2-D12) دون مساس. بعدها أي رمز للحساب ← ACCOUNT_DELETED أو AUTH_SESSION_REVOKED.

