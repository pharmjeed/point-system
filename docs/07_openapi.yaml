  /v1/cash-handovers:
    post:
      operationId: confirmCashHandover
      summary: استلام نقد السائق
      tags: [Payments]
      description: |-
        المشرف المستلم يسجل المبلغ؛ يحسب الخادم المتوقع من تحصيلات السائق النقدية غير المعكوسة وغير المسلّمة في الحفل ويربطها.

        الأثر: cash_handovers + payments.cash_handover_id؛ فرق ≠ 0 يفتح واقعة payment_discrepancy

        الشروط (DEC-275، DEC-276، DEC-283): السائق هو المستلم ← PERMISSION_DENIED (permission: cash.handover_confirm، reason: self_handover) قبل أي قفل؛ الحفل خارج النطاق ← RESOURCE_NOT_FOUND (event)، والسائق من مؤسسة أخرى ← (driver)؛ الحفل draft ← INVALID_STATE_TRANSITION (allowed_from [open, closing])، وclosed أو canceled ← EVENT_ALREADY_CLOSED؛ المتوقع 0 والمبلغ 0 ← VALIDATION_FAILED (amount_halalas، nothing_to_hand_over)؛ أي سائق في المؤسسة يسلّم نقدًا حصّله في هذا الحفل. الواقعة التلقائية تُعاد incident_id ويُعثر عليها من صف التدقيق (metadata.incident_id، DEC-284).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  format: uuid
                driver_id:
                  type: string
                  format: uuid
                amount_halalas:
                  type: integer
                  format: int64
                  minimum: 0
                  description: مبلغ بالهللة (SAR × 100)
                note:
                  type: [string, 'null']
                  maxLength: 300
              required: [event_id, driver_id, amount_halalas]
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashHandoverEnvelope'
        '401':
          $ref: '#/components/responses/Error'
          description: AUTH_SESSION_EXPIRED | AUTH_SESSION_REVOKED | AUTH_UNAUTHENTICATED
        '403':
          $ref: '#/components/responses/Error'
          description: AUTH_MFA_SETUP_REQUIRED | AUTH_SECRET_CHANGE_REQUIRED | PERMISSION_DENIED
        '404':
          $ref: '#/components/responses/Error'
          description: RESOURCE_NOT_FOUND
        '409':
          $ref: '#/components/responses/Error'
          description: EVENT_ALREADY_CLOSED | IDEMPOTENCY_IN_PROGRESS | INVALID_STATE_TRANSITION
        '413':
          $ref: '#/components/responses/Error'
          description: PAYLOAD_TOO_LARGE
        '422':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REUSED | VALIDATION_FAILED
        '428':
          $ref: '#/components/responses/Error'
          description: IDEMPOTENCY_KEY_REQUIRED
        '429':
          $ref: '#/components/responses/RateLimited'
          description: RATE_LIMITED
        '500':
          $ref: '#/components/responses/Error'
          description: INTERNAL_ERROR
        '503':
          $ref: '#/components/responses/Error'
          description: SERVICE_UNAVAILABLE
      security:
      - cookieSession: []
        csrfHeader: []
      x-permission: cash.handover_confirm
      x-idempotency: required
      x-rate-limit-class: command
      x-error-codes: [EVENT_ALREADY_CLOSED, INVALID_STATE_TRANSITION, PERMISSION_DENIED, RESOURCE_NOT_FOUND]
      x-domain-events: [cash.handover_recorded, incident.opened]
