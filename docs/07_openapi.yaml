              type: object
              properties:
                verification:
                  oneOf:
                  - type: object
                    properties:
                      method:
                        type: string
                        const: code
                      code:
                        type: string
                        pattern: ^[0-9]{6}$
                    required: [method, code]
                    additionalProperties: false
                  - type: object
                    properties:
                      method:
                        type: string
                        const: paper_stub
                      paper_serial:
                        type: string
                        maxLength: 20
                    required: [method, paper_serial]
                    additionalProperties: false
