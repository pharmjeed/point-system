        حسابات المنصة فقط (platform_users)، منفصلة تمامًا عن حسابات الموظفين: جوال + كلمة مرور، ثم TOTP دائمًا (V2-002، DEC-462).
        الحساب المفعّل له MFA ← mfa_required=true وmfa_token (5 دقائق، استخدام واحد) دون كوكي. الدخول الأول (كلمة مرور مؤقتة من create-platform-owner) ← جلسة مقيدة بمسارات platform.self حتى تغيير كلمة المرور ثم إعداد TOTP.

        الشروط: 5 محاولات فاشلة ثم قفل 15 دقيقة (PLATFORM_SECURITY)

        الأثر: platform_sessions (sha256 فقط) + Set-Cookie: __Host-point_psid للجلسة المقيدة؛ platform_audit_log في المعاملة نفسها
