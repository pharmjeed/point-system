        الشروط: status=received (أو parking لإكمال صور ناقصة قبل الاعتماد) · ضمن inspection.max_extra_photos

        الأثر: media_assets(pending) + رابط PUT موقّع للتخزين الخاص
      parameters:
      - $ref: '#/components/parameters/ticketId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  $ref: '#/components/schemas/MediaKind'
                content_type:
                  $ref: '#/components/schemas/MediaContentType'
                byte_size:
                  type: integer
                  minimum: 1
                  maximum: 10485760
                sha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                captured_at:
                  type: string
                  format: date-time
              required: [kind, content_type, byte_size]
