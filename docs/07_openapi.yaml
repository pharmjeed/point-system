      tags: [Reports & Exports]
      description: |-
        الأثر: exports(pending) + job.export_generate + audit_log إلزامي؛ audit يتطلب audit.read

        قواعد التصدير (DEC-289، DEC-292): يرد 202 بالتصدير pending؛ job.export_generate يعيد حساب نطاق الطالب (غير نشط ← failed بـerror = requester_inactive، وموقع أو حفل سُحب ← scope_revoked)، ويقرأ في معاملة REPEATABLE READ READ ONLY واحدة، ويرفع الملف خارج أي معاملة (يبقى 24 ساعة)، ويفشل too_many_rows فوق 50 000 صف، ويعيد محاولة انقطاع التخزين (storage_unavailable، storage_error)؛ المرشحات تُجمع بـAND (drivers مع event_id = موقع الحفل في الفترة؛ بلا to = حتى وقت التوليد)؛ النوع audit يتطلب audit.read (PERMISSION_DENIED بـaudit_read_required)؛ حفل المرشح خارج النطاق ← RESOURCE_NOT_FOUND، وvenue_id المسمّى ← SCOPE_VENUE_DENIED؛ لا رمز ولا موضع مفتاح ولا كعب ولا صورة ولا جوال كامل في أي ملف. حد المعدل: فئة export (5 في الساعة لكل مستخدم).
