                  format: uuid
                labels:
                  type: array
                  items:
                    type: string
                    maxLength: 20
                  maxItems: 500
                range:
                  type: object
                  properties:
                    prefix:
                      type: string
                      maxLength: 10
                      examples: [B-]
                    from:
                      type: integer
                      minimum: 0
                    to:
                      type: integer
                      minimum: 0
