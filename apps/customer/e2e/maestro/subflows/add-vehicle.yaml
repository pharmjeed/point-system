# C-05 (option 3, DEC-638): step 1 the plate digits and its three letters typed in Latin on the phone's keyboard,
# step 2 the sedan tile, white and Toyota; ends where the form returns.
appId: sa.point.app
env:
  DIGITS: '1234'
  LETTERS: 'ABD'
---
- assertVisible: 'ما لوحة سيارتك؟'
- tapOn:
    id: plate-digits
- inputText: ${DIGITS}
- tapOn:
    id: plate-letters
- inputText: ${LETTERS}
- hideKeyboard
- tapOn:
    id: vehicle-next
- assertVisible: 'نوعها ولونها'
- tapOn:
    id: vehicle-type-sedan
- tapOn:
    id: vehicle-color-white
- tapOn:
    id: vehicle-make
- tapOn:
    id: vehicle-make-toyota
- tapOn:
    id: vehicle-submit
