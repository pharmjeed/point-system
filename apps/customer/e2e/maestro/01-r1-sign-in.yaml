# R1 on a device (mirrors e2e/r1-sign-in.spec.ts): C-01 → C-02 → C-03 (code from the dev banner) → C-04 → C-05 →
# C-06. On the device also: the Arabic app name under the icon, the native RTL layout, the numeric keypads.
appId: sa.point.app
name: R1 — sign in, first vehicle, home
tags: [h2, r1]
---
- runFlow:
    file: subflows/sign-up.yaml
    env:
      PHONE: '512340001'
- runFlow: subflows/add-vehicle.yaml
# C-06 without a subscription (DEC-639): «أين تركن عادةً؟», the places on the map and in the sheet
- extendedWaitUntil:
    visible:
      id: home-places
    timeout: 10000
- assertVisible: '.*سارة.*'
- assertVisible:
    id: home-subscribe
- takeScreenshot: r1-home-places
# subscribed: the entry pass under «مشترك · …», the car and the renewal
- runFlow: subflows/subscribe-from-home.yaml
- assertVisible: 'مشترك · .*'
- assertVisible: 'بطاقة الدخول'
- assertVisible:
    id: home-subscription
- takeScreenshot: r1-home-subscribed
