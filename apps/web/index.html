<!doctype html>
<!-- Staff app head: brand/manifest/head-snippet.html. The driver default theme is "system" (DEC-19);
     staff areas switch to "light" at runtime (src/lib/theme.ts). No inline scripts (CSP, 09 §9.3). -->
<html lang="ar" dir="rtl" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#015AFE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020C22" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%VITE_BRAND_STAFF_NAME_AR%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="same-origin" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%VITE_BRAND_STAFF_NAME_AR%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
