# DEC-457: the server installation (infra/deploy/install.sh) end to end on a fresh Docker host, in both modes:
#   direct   POINT's Caddy owns 80/443 (local CA instead of Let's Encrypt)
#   gateway  a shared Caddy gateway already owns 80/443 and imports /data/conf.d/*.caddyfile (the shape of the
#            production server, where other projects run): the installer adds its site file and reloads it
# and the backend image built for linux/arm64 (the production server is an Ampere A1) with its native modules.
# V2 (DEC-635): the staging stack with the payment simulator — the customer API, the /customer socket handshake, the
# platform console and its owner, a payment-simulator round trip both ways, the free-disk guard, and an install of
# the first release upgraded in place (the new .env keys appended, every secret kept).
# Runs on pull requests to ANY base (the V2 pull request targets the V1 branch) when the deployment files or the code
# in the stack change, or by hand (limited minutes on a private repository).
name: Deploy smoke

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/**'
      - '!apps/customer/**'
      - 'packages/db/**'
      - 'packages/server/src/core/config/**'
      - '.env.example'
      - '.github/workflows/deploy-smoke.yml'
      - 'pnpm-lock.yaml'
      - 'tools/wa-simulator/**'
      - 'tools/payment-simulator/**'
  workflow_dispatch:

concurrency:
  group: deploy-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OWNER_PHONE: '0550000001'
  OWNER_NAME: 'CI Owner'

jobs:
  install:
    name: install.sh (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, gateway]
    env:
      DOMAIN: app.point.test
      SIM_DOMAIN: ${{ matrix.mode == 'gateway' && 'sim.point.test' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Hosts resolve to this runner
        run: echo "127.0.0.1 app.point.test sim.point.test other.point.test" | sudo tee -a /etc/hosts

      - name: Direct mode — local CA instead of Let's Encrypt
        if: matrix.mode == 'direct'
        run: printf 'tls internal\n' > infra/caddy/conf.d/99-ci.caddy

      - name: Gateway mode — a shared gateway with another site, like the production server
        if: matrix.mode == 'gateway'
        run: |
          mkdir -p "$RUNNER_TEMP/gw"
          printf '{\n\tlocal_certs\n}\n\nother.point.test {\n\trespond "other site"\n}\n\nimport /data/conf.d/*.caddyfile\n' > "$RUNNER_TEMP/gw/Caddyfile"
          docker network create vm_default
          docker volume create vm_caddydata
          docker run --rm -v vm_caddydata:/data alpine mkdir -p /data/conf.d
          docker run -d --name vm-caddy-1 --network vm_default -p 80:80 -p 443:443 \
            -v "$RUNNER_TEMP/gw/Caddyfile:/etc/caddy/Caddyfile:ro" -v vm_caddydata:/data caddy:2
          for i in $(seq 1 30); do
            docker exec vm-caddy-1 test -f /data/caddy/pki/authorities/local/root.crt && break
            sleep 1
          done
          docker exec vm-caddy-1 cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/gw-ca.crt"
          curl -fsS --cacert "$RUNNER_TEMP/gw-ca.crt" https://other.point.test/ | grep -q 'other site'

      - name: Install
        env:
          POINT_YES: '1'
          POINT_MODE: ${{ matrix.mode }}
          ACME_EMAIL: ci@point.test
          # hosted runners have less free disk than a server; the guard itself has its own step below
          POINT_MIN_FREE_GB: '5'
        run: |
          [ "$POINT_MODE" != gateway ] || export CURL_CA_BUNDLE="$RUNNER_TEMP/gw-ca.crt"
          bash infra/deploy/install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
          test "${PIPESTATUS[0]}" = 0
          test "$(stat -c %a .env)" = 600
          # disk report before/after the build, and no secret of .env in the output
          grep -q 'before: .* GB free' "$RUNNER_TEMP/install.log"
          grep -q 'after: .* GB free' "$RUNNER_TEMP/install.log"
          grep -q 'payment simulator reachable from the api' "$RUNNER_TEMP/install.log"
          for k in SESSION_SECRET MOYASAR_SECRET_KEY MOYASAR_WEBHOOK_SECRET EINVOICE_WEBHOOK_SECRET POINT_API_DB_PASSWORD; do
            v=$(sed -n "s/^$k=//p" .env); test -n "$v"
            if grep -qF "$v" "$RUNNER_TEMP/install.log"; then echo "$k is in the output"; exit 1; fi
          done

      - name: The site works through the front door
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = gateway ]; then
            CA="$RUNNER_TEMP/gw-ca.crt"
          else
            CA="$RUNNER_TEMP/point-ca.crt"
            docker exec point-web-1 cat /data/caddy/pki/authorities/local/root.crt > "$CA"
          fi
          base=https://$DOMAIN
          c() { curl -sS --cacert "$CA" "$@"; }
          test "$(c -o /dev/null -w '%{http_code}' $base/health/ready)" = 200
          c -D "$RUNNER_TEMP/h.txt" -o "$RUNNER_TEMP/index.html" $base/d/start
          grep -qi '^content-security-policy: .*connect-src .self. wss://app.point.test' "$RUNNER_TEMP/h.txt"
          grep -qi '^strict-transport-security:' "$RUNNER_TEMP/h.txt"
          grep -q '<div id="root">' "$RUNNER_TEMP/index.html"
          test "$(c -o /dev/null -w '%{http_code}' $base/metrics)" = 404
          # the private bucket is on the origin and refuses an unsigned request
          test "$(c -o /dev/null -w '%{http_code}' $base/point-media/x.jpg)" = 403
          # the first owner signs in with the one-time password: restricted session (change it, then MFA)
          pw=$(sed -n '/^owner created/,/temporary password/ s/.*temporary password (shown once): //p' "$RUNNER_TEMP/install.log" | tr -d '\r')
          test -n "$pw"
          body=$(jq -nc --arg p "$OWNER_PHONE" --arg s "$pw" '{phone:$p, secret:$s}')
          r=$(c -c "$RUNNER_TEMP/jar" -H 'Content-Type: application/json' -H 'X-Requested-With: point-web' \
                -H "Origin: $base" -d "$body" $base/v1/auth/login)
          echo "$r" | jq -e '.data.must_change_secret == true and .data.mfa_setup_required == true'
          grep -q '__Host-point_sid' "$RUNNER_TEMP/jar"
          c -b "$RUNNER_TEMP/jar" $base/v1/me | jq -e '.data.session.pending == ["secret_change","mfa_setup"]'
          # a wrong Origin is refused (CSRF, the origin seen through every proxy hop)
          test "$(c -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'X-Requested-With: point-web' \
                  -H 'Origin: https://evil.test' -d "$body" $base/v1/auth/login)" = 403
          # the WhatsApp simulator runs (staging), never published on its own
          bash infra/deploy/pc.sh exec -T wa-simulator wget -qO- http://127.0.0.1:4010/_sim/health

      - name: V2 — customer API, customer socket, platform console, payment simulator
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = gateway ]; then CA="$RUNNER_TEMP/gw-ca.crt"; else CA="$RUNNER_TEMP/point-ca.crt"; fi
          base=https://$DOMAIN
          c() { curl -sS --cacert "$CA" "$@"; }
          # the customer app's sign-in code request (/v1/customer/*: no Origin, no cookie, CSRF-exempt by design) reaches
          # the customer module; until the owner creates the WhatsApp channel (S-13, §14) it answers «no channel»
          c -H 'Content-Type: application/json' \
            -d '{"phone_e164":"+966550000002","device_id":"ci-device-0001","platform":"android"}' \
            $base/v1/customer/auth/otp | jq -e '.error.code == "WA_CHANNEL_UNAVAILABLE" and .error.details.reason == "no_channel"'
          # without a token the customer API answers 401 (the api, not the PWA)
          test "$(c -o /dev/null -w '%{http_code}' $base/v1/customer/me)" = 401
          # the customer socket (namespace /customer on /ws): a WebSocket upgrade with a customer-shaped Bearer token is
          # accepted through every proxy hop (the namespace itself then checks the session)
          code=$(c --http1.1 -o /dev/null -w '%{http_code}' --max-time 5 -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
                   -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: cG9pbnQtY2ktc21va2UtMQ==' \
                   -H 'Authorization: Bearer pca.7d3f1c2e-5b6a-4c8d-9e0f-1a2b3c4d5e6f.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' "$base/ws/?EIO=4&transport=websocket" 2>/dev/null || true)
          test "$code" = 101
          # the platform console page (the PWA's /platform routes) and its first owner's restricted session
          c -o "$RUNNER_TEMP/platform.html" -w '%{http_code}' $base/platform/login | grep -qx 200
          grep -q '<div id="root">' "$RUNNER_TEMP/platform.html"
          ppw=$(sed -n '/^platform owner created/,/temporary password/ s/.*temporary password (shown once): //p' "$RUNNER_TEMP/install.log" | tr -d '\r')
          test -n "$ppw"
          body=$(jq -nc --arg p "$OWNER_PHONE" --arg s "$ppw" '{phone:$p, secret:$s}')
          c -c "$RUNNER_TEMP/pjar" -H 'Content-Type: application/json' -H 'X-Requested-With: point-web' \
            -H "Origin: $base" -d "$body" $base/v1/platform/auth/login |
            jq -e '.data.must_change_secret == true and .data.mfa_setup_required == true'
          grep -q '__Host-point_psid' "$RUNNER_TEMP/pjar"
          # the V2 webhooks reach the api (not the PWA): an unsigned body is refused by the api
          test "$(c -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' $base/webhooks/payments/moyasar)" != 200
          c -H 'Content-Type: application/json' -d '{}' $base/webhooks/payments/moyasar | jq -e '.error.code'
          c -H 'Content-Type: application/json' -d '{}' $base/webhooks/einvoicing | jq -e '.error.code'
          bash infra/deploy/smoke-payments.sh

      - name: The free-disk guard stops before building and leaves the stack running
        env:
          POINT_YES: '1'
          POINT_MIN_FREE_GB: '100000'
        run: |
          [ "${{ matrix.mode }}" != gateway ] || export CURL_CA_BUNDLE="$RUNNER_TEMP/gw-ca.crt"
          if bash infra/deploy/install.sh > "$RUNNER_TEMP/guard.log" 2>&1; then cat "$RUNNER_TEMP/guard.log"; exit 1; fi
          grep -q 'a build needs at least 100000 GB' "$RUNNER_TEMP/guard.log"
          if grep -q 'Building the images' "$RUNNER_TEMP/guard.log"; then exit 1; fi
          bash infra/deploy/pc.sh exec -T api node -e "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"

      - name: Gateway — simulator page behind its password, the other site untouched
        if: matrix.mode == 'gateway'
        run: |
          set -euo pipefail
          CA="$RUNNER_TEMP/gw-ca.crt"
          pw=$(sed -n 's/^POINT_SIM_PASSWORD=//p' .env)
          test "$(curl -sS --cacert "$CA" -o /dev/null -w '%{http_code}' https://sim.point.test/)" = 401
          test "$(curl -sS --cacert "$CA" -o /dev/null -w '%{http_code}' -u "sim:$pw" https://sim.point.test/)" = 200
          curl -fsS --cacert "$CA" https://other.point.test/ | grep -q 'other site'
          # nothing of POINT listens on a public interface
          ! ss -ltnH | awk '{print $4}' | grep -E '^(0\.0\.0\.0|\[::\]|\*):(3000|4010|4020|5432|8095|8097|8495|9000|9464|9465)$'

      - name: Re-running the installer is the update and keeps the secrets
        env:
          POINT_YES: '1'
          POINT_SKIP_BUILD: '1'
        run: |
          [ "${{ matrix.mode }}" != gateway ] || export CURL_CA_BUNDLE="$RUNNER_TEMP/gw-ca.crt"
          before=$(grep -E '^(SESSION_SECRET|DATA_ENCRYPTION_KEY|POINT_API_DB_PASSWORD|MOYASAR_WEBHOOK_SECRET)=' .env | sha256sum)
          bash infra/deploy/install.sh
          test "$before" = "$(grep -E '^(SESSION_SECRET|DATA_ENCRYPTION_KEY|POINT_API_DB_PASSWORD|MOYASAR_WEBHOOK_SECRET)=' .env | sha256sum)"
          test "$(grep -c '^POINT_OWNER_CREATED=' .env)" = 1
          test "$(grep -c '^POINT_PLATFORM_OWNER_CREATED=' .env)" = 1
          test "$(grep -c '^MOYASAR_SECRET_KEY=' .env)" = 1

      - name: An install of the first release is upgraded in place (DEC-631)
        env:
          POINT_YES: '1'
          POINT_SKIP_BUILD: '1'
        run: |
          set -euo pipefail
          [ "${{ matrix.mode }}" != gateway ] || export CURL_CA_BUNDLE="$RUNNER_TEMP/gw-ca.crt"
          # back to the shape of a V1 install: no payment simulator, none of the V2 keys in .env
          bash infra/deploy/pc.sh rm -sf payment-simulator
          v2='PLATFORM_SESSION_COOKIE_NAME|WA_TEMPLATE_SET|CUSTOMER_[A-Z_]+|MOYASAR_[A-Z_]+|EINVOICE_[A-Z_]+|INVOICE_SELLER_[A-Z_]+|EXPO_ACCESS_TOKEN|POINT_PLATFORM_OWNER_CREATED'
          sed -i -E "/^($v2)=/d" .env
          sed -i 's#:infra/compose/docker-compose.payment-simulator.yml##' .env
          if grep -qE "^($v2)=" .env; then exit 1; fi
          kept=$(grep -E '^(SESSION_SECRET|DATA_ENCRYPTION_KEY|POINT_API_DB_PASSWORD|WA_APP_SECRET)=' .env | sha256sum)
          bash infra/deploy/install.sh 2>&1 | tee "$RUNNER_TEMP/upgrade.log"
          test "${PIPESTATUS[0]}" = 0
          grep -q 'new key(s) for this version' "$RUNNER_TEMP/upgrade.log"
          test "$kept" = "$(grep -E '^(SESSION_SECRET|DATA_ENCRYPTION_KEY|POINT_API_DB_PASSWORD|WA_APP_SECRET)=' .env | sha256sum)"
          test "$(stat -c %a .env)" = 600
          grep -q '^MOYASAR_BASE_URL=http://payment-simulator:4020$' .env
          grep -q 'docker-compose.payment-simulator.yml' .env
          # the new secrets are not printed; the simulator came back with them and the round trip works
          if grep -qF "$(sed -n 's/^MOYASAR_WEBHOOK_SECRET=//p' .env)" "$RUNNER_TEMP/upgrade.log"; then exit 1; fi
          bash infra/deploy/smoke-payments.sh

      - name: Logs on failure
        if: failure()
        run: |
          bash infra/deploy/pc.sh ps || true
          bash infra/deploy/pc.sh logs --tail 80 || true
          docker logs --tail 60 vm-caddy-1 2>/dev/null || true

  arm64:
    name: backend image on linux/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (emulated arm64)
        run: docker buildx build --platform linux/arm64 -f infra/docker/Dockerfile -t point-backend:arm64 --load .
      - name: Native modules load on arm64
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh point-backend:arm64 -c '
            set -e
            test "$(uname -m)" = aarch64
            for m in argon2 sharp; do
              d=$(find /app/api/node_modules/.pnpm -maxdepth 3 -type d -path "*/node_modules/$m" | head -1)
              test -n "$d"
              node -e "require(process.argv[1]); console.log(process.argv[1], \"ok\")" "$d"
            done'
